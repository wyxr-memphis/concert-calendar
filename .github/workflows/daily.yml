name: Daily Concert Calendar Update

on:
  schedule:
    # Run twice daily for resilience — if one run fails, calendar is stale
    # for at most ~12 hours instead of 24
    - cron: '0 5 * * *'   # 5 AM UTC = 12 AM Central (midnight)
    - cron: '0 17 * * *'  # 5 PM UTC = 12 PM Central (noon)
  workflow_dispatch:  # Allow manual trigger

# Serialize builds so concurrent dispatches (e.g. multiple Slack image uploads
# in quick succession) don't race each other on the final `git push` step.
# Queued runs collapse to one pending run — later dispatches replace it.
concurrency:
  group: daily-calendar-build
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calendar update
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITEWRENCH_API_TOKEN: ${{ secrets.SITEWRENCH_API_TOKEN }}
        run: python -m src.main

      - name: Clean up old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '24 hours ago' +%s 2>/dev/null || date -u -v-24H +%s)
          gh api repos/${{ github.repository }}/contents/artifacts --jq '.[] | select(.type=="file") | .name' 2>/dev/null | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$FILE'))" 2>/dev/null || echo "$FILE")
            COMMIT_DATE=$(gh api "repos/${{ github.repository }}/commits?path=artifacts/$ENCODED&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || true)
            if [ -n "$COMMIT_DATE" ]; then
              FILE_TS=$(date -u -d "$COMMIT_DATE" +%s 2>/dev/null || true)
              if [ -n "$FILE_TS" ] && [ "$FILE_TS" -lt "$CUTOFF" ]; then
                echo "Deleting old artifact: $FILE"
                SHA=$(gh api "repos/${{ github.repository }}/contents/artifacts/$ENCODED" --jq '.sha')
                gh api -X DELETE "repos/${{ github.repository }}/contents/artifacts/$ENCODED" -f message="Clean up old artifact: $FILE" -f sha="$SHA" || true
              fi
            fi
          done || true

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ data/events.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update calendar - $(date)"

          # The concurrency group above can still let two builds slip through its
          # few-second race window and run at once. Both generate the same snapshot
          # files from PostgreSQL (the source of truth), so on a push collision we
          # just rebase (keeping our fresh build via -X theirs) and retry. If we're
          # ultimately outraced, the winning build already published fresh data, so
          # exit 0 with a warning rather than failing the run with a false alarm.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a concurrent build); retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "::warning::Could not push after 5 attempts; a concurrent build likely published fresher data already. PostgreSQL remains the source of truth."
          exit 0
