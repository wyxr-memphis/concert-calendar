<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapers — Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.5;
        }
        header {
            border-bottom: 3px solid #1a1a1a;
            padding-bottom: 12px;
            margin-bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }
        h1 { font-size: 1.4em; font-weight: 700; letter-spacing: 0.02em; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .header-actions button {
            font-size: 0.85em;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            border: none;
        }
        .btn-logout { background: #e8e8e8; color: #1a1a1a; }
        .btn-logout:hover { background: #ddd; }
        .btn-refresh { background: #1a1a1a; color: #fafafa; }
        .btn-refresh:hover { background: #333; }

        .nav-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .nav-tab {
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.15s;
            text-decoration: none;
        }
        .nav-tab:hover { color: #333; }
        .nav-tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

        #content { display: none; }

        .status-bar {
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-bottom: 12px;
            display: none;
        }
        .status-bar.error { background: #ffebee; color: #c62828; display: block; }
        .status-bar.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .status-bar.info { background: #e3f2fd; color: #1565c0; display: block; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Alert banner */
        .alert-banner {
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 0.9em;
            display: none;
        }
        .alert-banner.visible { display: block; }
        .alert-banner.alert-error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }
        .alert-banner.alert-warning {
            background: #fff3e0;
            color: #e65100;
            border-left: 4px solid #e65100;
        }

        /* Scraper status cards */
        .scraper-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        .scraper-card {
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 16px;
            background: #fff;
        }
        .scraper-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.success { background: #2e7d32; }
        .status-dot.partial { background: #f9a825; }
        .status-dot.failed { background: #c62828; }
        .status-dot.running { background: #bbb; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .scraper-name {
            font-weight: 600;
            font-size: 0.95em;
        }
        .scraper-stats {
            font-size: 0.8em;
            color: #888;
            line-height: 1.6;
        }
        .scraper-stats .stat-label { color: #aaa; }
        .stale-warning {
            display: inline-block;
            background: #fff3e0;
            color: #e65100;
            font-size: 0.75em;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
        .scraper-total {
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #888;
        }
        .scraper-total strong { color: #1a1a1a; }

        /* Recent runs log */
        .section-title {
            font-size: 0.95em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #555;
            margin-bottom: 12px;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        .log-table th {
            text-align: left;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            padding: 6px 8px;
            border-bottom: 2px solid #ddd;
        }
        .log-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        .log-table tr { cursor: pointer; }
        .log-table tr:hover { background: #f5f5f5; }
        .log-table .status-cell {
            font-weight: 600;
        }
        .log-table .status-cell.success { color: #2e7d32; }
        .log-table .status-cell.partial { color: #e65100; }
        .log-table .status-cell.failed { color: #c62828; }
        .log-table .status-cell.running { color: #888; }

        /* Expandable detail row */
        .log-detail {
            display: none;
            background: #f8f8f8;
        }
        .log-detail.expanded { display: table-row; }
        .log-detail td {
            padding: 12px;
            font-size: 0.85em;
            color: #555;
        }
        .log-detail pre {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 10px;
            font-size: 0.9em;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 0.8em;
            color: #aaa;
            text-align: center;
        }
        footer a { color: inherit; }

        @media (prefers-color-scheme: dark) {
            body { background: #1a1a1a; color: #e0e0e0; }
            header { border-bottom-color: #e0e0e0; }
            .nav-tabs { border-bottom-color: #333; }
            .nav-tab { color: #666; }
            .nav-tab:hover { color: #ccc; }
            .nav-tab.active { color: #e0e0e0; border-bottom-color: #e0e0e0; }
            .btn-logout { background: #333; color: #e0e0e0; }
            .btn-logout:hover { background: #444; }
            .btn-refresh { background: #e0e0e0; color: #1a1a1a; }
            .btn-refresh:hover { background: #ccc; }
            .scraper-card { background: #2a2a2a; border-color: #333; }
            .scraper-name { color: #e0e0e0; }
            .scraper-stats { color: #777; }
            .scraper-stats .stat-label { color: #666; }
            .scraper-total strong { color: #e0e0e0; }
            .section-title { color: #888; }
            .log-table th { color: #666; border-bottom-color: #333; }
            .log-table td { border-bottom-color: #2a2a2a; }
            .log-table tr:hover { background: #252525; }
            .log-detail { background: #222; }
            .log-detail td { color: #aaa; }
            .log-detail pre { background: #2a2a2a; border-color: #333; color: #e0e0e0; }
            .alert-banner.alert-error { background: #3a1b1b; color: #ef9a9a; border-left-color: #ef9a9a; }
            .alert-banner.alert-warning { background: #3a2a1b; color: #ffb74d; border-left-color: #ffb74d; }
            .stale-warning { background: #3a2a1b; color: #ffb74d; }
            .status-bar.error { background: #3a1b1b; color: #ef9a9a; }
            .status-bar.success { background: #1b3a1b; color: #81c784; }
            .status-bar.info { background: #1b2a3a; color: #90caf9; }
            footer { border-top-color: #333; color: #555; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loadingMsg">Checking authentication...</div>

    <div id="content">
        <header>
            <h1>ADMIN</h1>
            <div class="header-actions">
                <button class="btn-refresh" id="refreshBtn">Refresh</button>
                <button class="btn-logout" id="logoutBtn">Log Out</button>
            </div>
        </header>

        <nav class="nav-tabs">
            <a href="/admin/" class="nav-tab">Events</a>
            <a href="/admin/import.html" class="nav-tab">Import</a>
            <a href="/admin/scrapers.html" class="nav-tab active">Scrapers</a>
        </nav>

        <div class="status-bar" id="statusBar"></div>
        <div class="alert-banner" id="alertBanner"></div>

        <!-- Scraper status cards -->
        <div class="scraper-total" id="scraperTotal"></div>
        <div class="scraper-cards" id="scraperCards">
            <div style="color:#888;padding:20px;text-align:center;">Loading scraper status...</div>
        </div>

        <!-- Recent runs log -->
        <h3 class="section-title">Recent Runs</h3>
        <table class="log-table">
            <thead>
                <tr>
                    <th>Scraper</th>
                    <th>Started</th>
                    <th>Duration</th>
                    <th>Status</th>
                    <th>Found</th>
                    <th>Added</th>
                    <th>Updated</th>
                    <th>Skipped</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <tr><td colspan="8" style="text-align:center;color:#888;padding:20px;">Loading...</td></tr>
            </tbody>
        </table>

        <footer>
            <a href="/">&larr; Back to calendar</a>
        </footer>
    </div>

    <script>window.__API_BASE = 'https://concert-calendar-api.onrender.com';</script>
    <script src="/admin/admin-common.js"></script>
    <script>
        // Auth guard
        AdminAPI.checkAuth().then(ok => {
            if (ok) {
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                loadDashboard();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => AdminAPI.logout());
        document.getElementById('refreshBtn').addEventListener('click', loadDashboard);

        async function loadDashboard() {
            await Promise.all([loadStatus(), loadLogs()]);
        }

        async function loadStatus() {
            try {
                const { resp, data } = await AdminAPI.apiJSON('/api/admin/scraper/status');
                if (!resp.ok) {
                    renderStatusFallback();
                    return;
                }
                renderStatusCards(data);
            } catch (err) {
                renderStatusFallback();
            }
        }

        function renderStatusFallback() {
            // If the Render API isn't available, show info from the build log
            const cards = document.getElementById('scraperCards');
            cards.innerHTML = `
                <div class="scraper-card">
                    <div class="scraper-card-header">
                        <span class="status-dot" style="background:#888;"></span>
                        <span class="scraper-name">Scraper Status Unavailable</span>
                    </div>
                    <div class="scraper-stats">
                        <div>The scraper status API requires the Render backend to be configured.</div>
                        <div style="margin-top:8px;">Scrapers run via GitHub Actions twice daily (midnight and noon Central).</div>
                        <div style="margin-top:4px;">Check <a href="https://github.com/wyxr-memphis/concert-calendar/actions" style="color:inherit;text-decoration:underline;">GitHub Actions</a> for run history.</div>
                    </div>
                </div>
            `;
            document.getElementById('scraperTotal').innerHTML = '';
        }

        function renderStatusCards(data) {
            const cards = document.getElementById('scraperCards');
            const alertBanner = document.getElementById('alertBanner');

            // Check for failures
            const failedScrapers = (data.scrapers || []).filter(s => s.last_status === 'failed');
            if (failedScrapers.length > 0) {
                alertBanner.className = 'alert-banner visible alert-error';
                alertBanner.innerHTML = `<strong>Alert:</strong> ${failedScrapers.length} scraper(s) failed on their last run: ${failedScrapers.map(s => s.name).join(', ')}`;
            }

            // Total
            document.getElementById('scraperTotal').innerHTML =
                `<strong>${data.total_scraped_events || 0}</strong> total scraped events in database`;

            if (!data.scrapers || data.scrapers.length === 0) {
                cards.innerHTML = '<div style="color:#888;padding:20px;text-align:center;">No scraper data available yet.</div>';
                return;
            }

            cards.innerHTML = data.scrapers.map(s => {
                const statusClass = s.last_status || 'running';
                const isStale = s.last_status === 'running' && s.last_run &&
                    (new Date() - new Date(s.last_run)) > 3600000; // 1 hour

                return `
                    <div class="scraper-card">
                        <div class="scraper-card-header">
                            <span class="status-dot ${esc(statusClass)}"></span>
                            <span class="scraper-name">${esc(s.name)}</span>
                            ${isStale ? '<span class="stale-warning">May have stalled</span>' : ''}
                        </div>
                        <div class="scraper-stats">
                            <div><span class="stat-label">Last run:</span> ${timeAgo(s.last_run)}</div>
                            <div><span class="stat-label">Status:</span> ${esc(s.last_status || 'unknown')}</div>
                            <div><span class="stat-label">Added:</span> ${s.events_added_last_run || 0} &middot;
                                 <span class="stat-label">Updated:</span> ${s.events_updated_last_run || 0}</div>
                            ${s.next_run ? `<div><span class="stat-label">Next run:</span> ${timeAgo(s.next_run)}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadLogs() {
            try {
                const { resp, data } = await AdminAPI.apiJSON('/api/admin/scraper/logs?limit=20');
                if (!resp.ok) {
                    renderLogsFallback();
                    return;
                }
                renderLogs(Array.isArray(data) ? data : []);
            } catch {
                renderLogsFallback();
            }
        }

        function renderLogsFallback() {
            const tbody = document.getElementById('logBody');
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#888;padding:20px;">
                Scraper logs require the Render backend with PostgreSQL. Check GitHub Actions for run history.
            </td></tr>`;
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logBody');

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#888;padding:20px;">No scraper logs yet.</td></tr>';
                return;
            }

            tbody.innerHTML = '';

            logs.forEach((log, i) => {
                const started = log.started_at ? new Date(log.started_at) : null;
                const finished = log.finished_at ? new Date(log.finished_at) : null;
                let duration = '-';
                if (started && finished) {
                    const diffSec = Math.round((finished - started) / 1000);
                    duration = diffSec < 60 ? `${diffSec}s` : `${Math.floor(diffSec / 60)}m ${diffSec % 60}s`;
                }

                const statusClass = log.status || 'running';
                const isStale = log.status === 'running' && started &&
                    (new Date() - started) > 3600000;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${esc(log.scraper_name || '')}</td>
                    <td>${started ? timeAgo(log.started_at) : '-'}</td>
                    <td>${duration}</td>
                    <td class="status-cell ${esc(statusClass)}">${esc(log.status || '')}${isStale ? ' <span class="stale-warning">Stalled?</span>' : ''}</td>
                    <td>${log.events_found || 0}</td>
                    <td>${log.events_added || 0}</td>
                    <td>${log.events_updated || 0}</td>
                    <td>${log.events_skipped || 0}</td>
                `;

                // Detail row
                const detailRow = document.createElement('tr');
                detailRow.className = 'log-detail';
                detailRow.id = `detail-${i}`;
                let detailContent = '';
                if (log.error_message) {
                    detailContent += `<strong>Error:</strong> ${esc(log.error_message)}<br><br>`;
                }
                if (log.details) {
                    detailContent += `<pre>${esc(JSON.stringify(log.details, null, 2))}</pre>`;
                }
                if (!detailContent) {
                    detailContent = 'No additional details.';
                }
                detailRow.innerHTML = `<td colspan="8">${detailContent}</td>`;

                // Toggle detail on click
                row.addEventListener('click', () => {
                    detailRow.classList.toggle('expanded');
                });

                tbody.appendChild(row);
                tbody.appendChild(detailRow);
            });
        }
    </script>
</body>
</html>
