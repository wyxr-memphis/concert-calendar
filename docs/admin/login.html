<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Memphis Live Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..100,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
    <meta name="theme-color" content="#FCE2B6">
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32">
</head>
<body class="admin-page narrow">
    <header>
        <img class="admin-mascot" src="/brand/mascot.svg" alt="" width="40" height="46">
        <div>
            <h1>ADMIN LOGIN</h1>
            <div class="subtitle">Memphis Live Music Calendar</div>
        </div>
    </header>

    <main class="admin-card login-card">
        <form id="loginForm">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" autofocus>
            </div>
            <button type="submit" id="loginBtn" class="btn-primary">Log In</button>
        </form>
        <div class="status" id="status"></div>
    </main>

    <footer>
        <a href="/">&larr; Back to calendar</a>
    </footer>

    <script>window.__API_BASE = 'https://concert-calendar-api.onrender.com';</script>
    <script>
        // API base URL — must point to Render backend
        const API_BASE = window.__API_BASE || '';

        function apiUrl(path) {
            return API_BASE ? API_BASE + path : path;
        }

        function apiFetch(path, opts = {}) {
            opts.credentials = API_BASE ? 'include' : 'same-origin';
            return fetch(apiUrl(path), opts);
        }

        // If already authenticated, redirect to admin. Store the token the
        // response echoes back: this bounce is how a new tab reaches the admin
        // UI on the cookie alone, and without a token in sessionStorage every
        // upload route (require_bearer_auth) would answer "Not authenticated".
        apiFetch('/api/admin/me')
            .then(async r => {
                if (!r.ok) return;
                try {
                    const data = await r.json();
                    if (data && data.token) {
                        sessionStorage.setItem('admin_token', data.token);
                        try { localStorage.setItem('wyxr_admin_hint', '1'); } catch (e) { /* storage blocked */ }
                    }
                } catch (err) { /* redirect anyway — admin-common.js re-hydrates */ }
                window.location.href = '/admin/';
            });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const status = document.getElementById('status');
            const password = document.getElementById('password').value;

            if (!password) {
                status.textContent = 'Enter the admin password.';
                status.className = 'status error';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            status.className = 'status';

            try {
                const resp = await apiFetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const data = await resp.json();

                if (data.ok) {
                    // Store token for Bearer auth (cross-origin)
                    if (data.token) {
                        sessionStorage.setItem('admin_token', data.token);
                        // Same hint admin-common.js sets: lets the public
                        // calendar show its pick controls in another tab.
                        try { localStorage.setItem('wyxr_admin_hint', '1'); } catch (e) { /* storage blocked */ }
                    }
                    window.location.href = '/admin/';
                } else {
                    status.textContent = data.error || 'Login failed';
                    status.className = 'status error';
                }
            } catch (err) {
                status.textContent = 'Network error: ' + err.message;
                status.className = 'status error';
            }

            btn.disabled = false;
            btn.textContent = 'Log In';
        });
    </script>
</body>
</html>
