<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..100,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
    <meta name="theme-color" content="#FCE2B6">
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32">
</head>
<body class="admin-page">
    <div class="loading" id="loadingMsg">Loading...</div>

    <div id="content">
        <header>
            <img class="admin-mascot" src="/brand/mascot.svg" alt="" width="40" height="46">
            <h1 id="pageTitle">ADD EVENT</h1>
            <a href="/admin/" class="back-link">&larr; Back to events</a>
        </header>

        <form id="eventForm" class="admin-card">
            <div class="form-group">
                <label for="title">Title <span class="req">*</span></label>
                <input type="text" id="title" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" list="venueList">
                    <datalist id="venueList"></datalist>
                </div>
                <div class="form-group">
                    <label for="date">Date <span class="req">*</span></label>
                    <input type="date" id="date" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="start_time">Start Time</label>
                    <input type="text" id="start_time" placeholder="e.g. 8 PM or Doors 7 / Show 8">
                </div>
                <div class="form-group">
                    <label for="doors_time">Doors Time</label>
                    <input type="text" id="doors_time" placeholder="e.g. 7 PM">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ticket_url">Ticket URL</label>
                    <input type="url" id="ticket_url" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="ticket_price">Ticket Price</label>
                    <input type="text" id="ticket_price" placeholder="e.g. $15 / $20">
                </div>
            </div>

            <div class="image-row">
                <div class="form-group">
                    <label for="image_url">Image URL</label>
                    <input type="url" id="image_url" placeholder="https://...">
                </div>
                <button type="button" class="btn-upload-img" id="uploadImgBtn">Upload</button>
                <input type="file" class="hidden-input" id="imageFileInput" accept="image/*">
            </div>
            <div class="image-preview" id="imagePreview"></div>

            <div class="form-row" style="margin-top:16px;">
                <div class="form-group">
                    <label for="neighborhood">Neighborhood</label>
                    <select id="neighborhood">
                        <option value="">— Not assigned —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" placeholder="e.g. Blues, Jazz, Rock">
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Optional description (HTML allowed)..."></textarea>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="is_wyxr_presents">
                    WYXR Presents
                </label>
                <label>
                    <input type="checkbox" id="is_featured">
                    Featured (WYXR Pick)
                </label>
                <label>
                    <input type="checkbox" id="is_active" checked>
                    Active
                </label>
            </div>

            <div class="actions">
                <button type="submit" class="btn-save" id="saveBtn">Save</button>
                <a href="/admin/" class="btn-cancel">Cancel</a>
                <button type="button" class="btn-deactivate" id="deactivateBtn" style="display:none;">Deactivate</button>
            </div>
        </form>

        <div class="status-bar" id="statusBar"></div>
    </div>

    <script>window.__API_BASE = 'https://concert-calendar-api.onrender.com';</script>
    <script src="/admin/admin-common.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('id');
        const fromSubmission = params.get('from_submission');
        const isEdit = !!eventId;
        let currentEvent = null;

        // Where the editor sends you afterwards. ?return=public (only that
        // literal, and only when editing an existing event) comes from the
        // "Edit event" button on the public calendar: go back to the calendar
        // with the show open. No URL is ever taken from the query string, so
        // this can't become an open redirect.
        const returnToPublic = isEdit && params.get('return') === 'public';
        const publicEventUrl = '/#event=' + encodeURIComponent(eventId || '');
        const adminHomeUrl = fromSubmission ? '/admin/#submissions' : '/admin/#events';
        const doneUrl = returnToPublic ? publicEventUrl : adminHomeUrl;

        // The public page caches events in localStorage (same origin) and
        // paints from that cache first; drop it so the edit shows immediately.
        function forgetPublicCache() {
            try { localStorage.removeItem('wyxr_events_cache'); } catch (e) { /* storage blocked */ }
        }

        document.querySelectorAll('.back-link, .btn-cancel').forEach(a => { a.href = doneUrl; });
        if (returnToPublic) {
            document.querySelector('.back-link').innerHTML = '&larr; Back to calendar';
        }

        const fields = ['title', 'venue', 'date', 'start_time', 'doors_time',
                        'ticket_url', 'ticket_price', 'image_url', 'neighborhood', 'genre', 'description'];

        // Auth guard
        // Populate neighborhood dropdown
        function populateNeighborhoods() {
            const builtIn = ['Midtown','Overton Square/Cooper-Young','Crosstown/Broad Avenue','Downtown/Beale Street','South Main Arts District','South Memphis (Graceland/Stax)','Germantown'];
            const all = [...builtIn];
            try {
                const custom = JSON.parse(localStorage.getItem('custom_neighborhoods') || '[]');
                custom.forEach(n => { if (!all.includes(n)) all.push(n); });
            } catch(e) {}
            const sel = document.getElementById('neighborhood');
            all.sort();
            all.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n;
                opt.textContent = n;
                sel.appendChild(opt);
            });
        }
        populateNeighborhoods();

        async function populateVenueList() {
            try {
                const { resp, data } = await AdminAPI.apiJSON('/api/admin/venues');
                if (!resp.ok) return;
                const dl = document.getElementById('venueList');
                dl.innerHTML = '';
                (Array.isArray(data) ? data : []).forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    dl.appendChild(opt);
                });
            } catch (e) { /* silently ignore — field still works without suggestions */ }
        }

        AdminAPI.checkAuth().then(ok => {
            if (ok) {
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                populateVenueList();
                if (isEdit) {
                    loadEvent();
                } else if (fromSubmission) {
                    prefillFromSubmission();
                }
            }
        });

        if (isEdit) {
            document.getElementById('pageTitle').textContent = 'EDIT EVENT';
            document.getElementById('deactivateBtn').style.display = '';
        } else if (fromSubmission) {
            document.getElementById('pageTitle').textContent = 'EDIT & APPROVE SUBMISSION';
        }

        function prefillFromSubmission() {
            const fieldMap = {
                'title': 'title',
                'venue': 'venue',
                'date': 'date',
                'start_time': 'start_time',
                'doors_time': 'doors_time',
                'ticket_url': 'ticket_url',
                'ticket_price': 'ticket_price',
                'genre': 'genre',
                'description': 'description',
                // Set when the submission carried a flyer — Edit & Approve
                // uploads it first and passes the Cloudinary URL through.
                'image_url': 'image_url',
            };
            for (const [urlKey, fieldId] of Object.entries(fieldMap)) {
                const val = params.get(urlKey);
                if (val) {
                    const el = document.getElementById(fieldId);
                    if (el) el.value = val;
                }
            }
            // Set source
            const sourceField = document.getElementById('source');
            if (sourceField) sourceField.value = 'submission';
        }

        // Image URL preview
        document.getElementById('image_url').addEventListener('change', updateImagePreview);
        function updateImagePreview() {
            const url = document.getElementById('image_url').value;
            const preview = document.getElementById('imagePreview');
            if (url) {
                preview.innerHTML = `<img src="${escAttr(url)}" alt="Preview" onerror="this.style.display='none'">`;
            } else {
                preview.innerHTML = '';
            }
        }

        // Image upload
        document.getElementById('uploadImgBtn').addEventListener('click', () => {
            document.getElementById('imageFileInput').click();
        });

        document.getElementById('imageFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            const uploadBtn = document.getElementById('uploadImgBtn');
            uploadBtn.textContent = 'Uploading...';
            uploadBtn.disabled = true;

            try {
                const resp = await AdminAPI.apiFetch('/api/admin/import/image', {
                    method: 'POST',
                    body: formData,
                });
                const data = await resp.json();
                if (data.image_url) {
                    document.getElementById('image_url').value = data.image_url;
                    updateImagePreview();
                    showStatus('Image uploaded', 'success');
                } else {
                    showStatus(uploadFailureMessage(resp, data), 'error');
                }
            } catch (err) {
                showStatus('Upload failed: ' + err.message, 'error');
            }

            uploadBtn.textContent = 'Upload';
            uploadBtn.disabled = false;
        });

        async function loadEvent() {
            try {
                const { resp, data } = await AdminAPI.apiJSON('/api/admin/events');
                if (!resp.ok) throw new Error('Failed to load');

                let events;
                if (Array.isArray(data)) {
                    events = data;
                } else if (data.data && data.data.events) {
                    events = data.data.events;
                } else {
                    events = [];
                }

                currentEvent = events.find(e => e.id === eventId);
                if (!currentEvent) {
                    showStatus('Event not found', 'error');
                    return;
                }

                fields.forEach(f => {
                    const el = document.getElementById(f);
                    if (el && currentEvent[f] != null) el.value = currentEvent[f];
                });
                document.getElementById('is_wyxr_presents').checked = !!currentEvent.is_wyxr_presents;
                document.getElementById('is_featured').checked = !!currentEvent.is_featured;
                document.getElementById('is_active').checked = currentEvent.is_active !== false;
                updateImagePreview();
            } catch (err) {
                showStatus('Failed to load event: ' + err.message, 'error');
            }
        }

        // Save
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const formData = {};
            fields.forEach(f => {
                const val = document.getElementById(f).value.trim();
                formData[f] = val || null;
            });
            formData.is_wyxr_presents = document.getElementById('is_wyxr_presents').checked;
            formData.is_featured = document.getElementById('is_featured').checked;
            formData.is_active = document.getElementById('is_active').checked;

            if (!formData.title || !formData.date) {
                showStatus('Title and date are required', 'error');
                btn.disabled = false;
                btn.textContent = 'Save';
                return;
            }

            try {
                let result;
                if (isEdit) {
                    result = await AdminAPI.apiJSON(`/api/admin/events/${eventId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData),
                    });

                    // Fallback to Vercel format
                    if (result.resp.status === 404) {
                        result = await AdminAPI.apiJSON('/api/admin/events', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...formData, id: eventId }),
                        });
                    }
                } else {
                    result = await AdminAPI.apiJSON('/api/admin/events', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData),
                    });
                }

                if (result.resp.ok || result.data.ok) {
                    // If this was from a submission, mark it as approved (without creating a duplicate event)
                    if (fromSubmission) {
                        try {
                            await AdminAPI.apiJSON(`/api/admin/submissions/${fromSubmission}/mark-approved`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({}),
                            });
                        } catch (e) {
                            console.warn('Failed to mark submission as approved:', e);
                        }
                    }
                    showStatus('Saved!', 'success');
                    if (returnToPublic) forgetPublicCache();
                    setTimeout(() => { window.location.href = doneUrl; }, 800);
                } else {
                    showStatus(result.data.error || 'Save failed', 'error');
                }
            } catch (err) {
                showStatus('Network error: ' + err.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Save';
        });

        // Deactivate
        document.getElementById('deactivateBtn').addEventListener('click', async () => {
            if (!confirm('Deactivate this event? It will be hidden from the public calendar.')) return;

            try {
                let result = await AdminAPI.apiJSON(`/api/admin/events/${eventId}`, {
                    method: 'DELETE',
                });

                if (result.resp.status === 404) {
                    result = await AdminAPI.apiJSON('/api/admin/events', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: eventId, is_active: false }),
                    });
                }

                if (result.resp.ok || result.data.ok) {
                    // A deactivated show is hidden, so there's nothing to reopen.
                    if (returnToPublic) forgetPublicCache();
                    window.location.href = returnToPublic ? '/' : '/admin/#events';
                } else {
                    showStatus(result.data.error || 'Failed to deactivate', 'error');
                }
            } catch (err) {
                showStatus('Network error: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
