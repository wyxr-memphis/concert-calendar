<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event — Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 16px;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.5;
        }
        header {
            border-bottom: 3px solid #1a1a1a;
            padding-bottom: 12px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        h1 { font-size: 1.4em; font-weight: 700; letter-spacing: 0.02em; }
        .back-link {
            font-size: 0.85em;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        #content { display: none; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .form-group { margin-bottom: 16px; }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
        label {
            display: block;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 4px;
        }
        label .req { color: #c62828; }
        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="url"],
        textarea,
        select {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.95em;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #1a1a1a;
            font-family: inherit;
        }
        textarea { min-height: 80px; resize: vertical; }

        .image-row { display: flex; gap: 8px; align-items: flex-end; }
        .image-row .form-group { flex: 1; }
        .image-row .btn-upload-img {
            padding: 8px 14px;
            font-size: 0.85em;
            font-weight: 600;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #1a1a1a;
            cursor: pointer;
            white-space: nowrap;
            height: 38px;
        }
        .image-row .btn-upload-img:hover { background: #eee; }
        .image-preview { margin-top: 8px; }
        .image-preview img {
            max-width: 200px;
            max-height: 120px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .checkbox-group {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9em;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 24px;
            font-size: 0.95em;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save { background: #1a1a1a; color: #fafafa; }
        .btn-save:hover { background: #333; }
        .btn-save:disabled { background: #999; cursor: not-allowed; }
        .btn-cancel { background: #e8e8e8; color: #1a1a1a; text-decoration: none; display: inline-block; text-align: center; }
        .btn-cancel:hover { background: #ddd; }
        .btn-deactivate { background: transparent; color: #c62828; border: 1px solid #c62828; margin-left: auto; }
        .btn-deactivate:hover { background: #ffebee; }

        .status-bar {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9em;
            display: none;
        }
        .status-bar.error { background: #ffebee; color: #c62828; display: block; }
        .status-bar.success { background: #e8f5e9; color: #2e7d32; display: block; }

        .hidden-input { display: none; }

        @media (prefers-color-scheme: dark) {
            body { background: #1a1a1a; color: #e0e0e0; }
            header { border-bottom-color: #e0e0e0; }
            .back-link { color: #888; }
            input[type="text"], input[type="date"], input[type="time"],
            input[type="url"], textarea, select {
                background: #2a2a2a;
                border-color: #444;
                color: #e0e0e0;
            }
            .btn-save { background: #e0e0e0; color: #1a1a1a; }
            .btn-save:hover { background: #ccc; }
            .btn-save:disabled { background: #555; color: #888; }
            .btn-cancel { background: #333; color: #e0e0e0; }
            .btn-cancel:hover { background: #444; }
            .btn-deactivate { color: #ef9a9a; border-color: #ef9a9a; }
            .btn-deactivate:hover { background: #3a1b1b; }
            .status-bar.error { background: #3a1b1b; color: #ef9a9a; }
            .status-bar.success { background: #1b3a1b; color: #81c784; }
            .image-row .btn-upload-img { background: #2a2a2a; border-color: #444; color: #e0e0e0; }
            .image-row .btn-upload-img:hover { background: #333; }
            .image-preview img { border-color: #444; }
        }

        @media (max-width: 500px) {
            .form-row { flex-direction: column; gap: 0; }
            .image-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loadingMsg">Loading...</div>

    <div id="content">
        <header>
            <h1 id="pageTitle">ADD EVENT</h1>
            <a href="/admin/" class="back-link">&larr; Back to events</a>
        </header>

        <form id="eventForm">
            <div class="form-group">
                <label for="title">Title <span class="req">*</span></label>
                <input type="text" id="title" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" list="venueList">
                    <datalist id="venueList">
                        <option value="Hi Tone">
                        <option value="Minglewood Hall">
                        <option value="Growlers">
                        <option value="Hernando's Hideaway">
                        <option value="Crosstown Arts">
                        <option value="Lafayette's Music Room">
                        <option value="Overton Park Shell">
                        <option value="B.B. King's Blues Club">
                        <option value="Graceland Soundstage">
                        <option value="FedExForum">
                        <option value="Germantown Performing Arts Center">
                        <option value="Orpheum Theatre">
                        <option value="Bar DKDC">
                        <option value="B-Side Memphis">
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="date">Date <span class="req">*</span></label>
                    <input type="date" id="date" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="start_time">Start Time</label>
                    <input type="text" id="start_time" placeholder="e.g. 8 PM or Doors 7 / Show 8">
                </div>
                <div class="form-group">
                    <label for="doors_time">Doors Time</label>
                    <input type="text" id="doors_time" placeholder="e.g. 7 PM">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ticket_url">Ticket URL</label>
                    <input type="url" id="ticket_url" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="ticket_price">Ticket Price</label>
                    <input type="text" id="ticket_price" placeholder="e.g. $15 / $20">
                </div>
            </div>

            <div class="image-row">
                <div class="form-group">
                    <label for="image_url">Image URL</label>
                    <input type="url" id="image_url" placeholder="https://...">
                </div>
                <button type="button" class="btn-upload-img" id="uploadImgBtn">Upload</button>
                <input type="file" class="hidden-input" id="imageFileInput" accept="image/*">
            </div>
            <div class="image-preview" id="imagePreview"></div>

            <div class="form-group" style="margin-top:16px;">
                <label for="genre">Genre</label>
                <input type="text" id="genre" placeholder="e.g. Blues, Jazz, Rock">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Optional description (HTML allowed)..."></textarea>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="is_featured">
                    Featured
                </label>
                <label>
                    <input type="checkbox" id="is_active" checked>
                    Active
                </label>
            </div>

            <div class="actions">
                <button type="submit" class="btn-save" id="saveBtn">Save</button>
                <a href="/admin/" class="btn-cancel">Cancel</a>
                <button type="button" class="btn-deactivate" id="deactivateBtn" style="display:none;">Deactivate</button>
            </div>
        </form>

        <div class="status-bar" id="statusBar"></div>
    </div>

    <script>window.__API_BASE = 'https://concert-calendar-api.onrender.com';</script>
    <script src="/admin/admin-common.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('id');
        const isEdit = !!eventId;
        let currentEvent = null;

        const fields = ['title', 'venue', 'date', 'start_time', 'doors_time',
                        'ticket_url', 'ticket_price', 'image_url', 'genre', 'description'];

        // Auth guard
        AdminAPI.checkAuth().then(ok => {
            if (ok) {
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                if (isEdit) loadEvent();
            }
        });

        if (isEdit) {
            document.getElementById('pageTitle').textContent = 'EDIT EVENT';
            document.getElementById('deactivateBtn').style.display = '';
        }

        // Image URL preview
        document.getElementById('image_url').addEventListener('change', updateImagePreview);
        function updateImagePreview() {
            const url = document.getElementById('image_url').value;
            const preview = document.getElementById('imagePreview');
            if (url) {
                preview.innerHTML = `<img src="${esc(url)}" alt="Preview" onerror="this.style.display='none'">`;
            } else {
                preview.innerHTML = '';
            }
        }

        // Image upload
        document.getElementById('uploadImgBtn').addEventListener('click', () => {
            document.getElementById('imageFileInput').click();
        });

        document.getElementById('imageFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            const uploadBtn = document.getElementById('uploadImgBtn');
            uploadBtn.textContent = 'Uploading...';
            uploadBtn.disabled = true;

            try {
                const resp = await AdminAPI.apiFetch('/api/admin/import/image', {
                    method: 'POST',
                    body: formData,
                });
                const data = await resp.json();
                if (data.image_url) {
                    document.getElementById('image_url').value = data.image_url;
                    updateImagePreview();
                    showStatus('Image uploaded', 'success');
                } else {
                    showStatus(data.error || 'Upload failed', 'error');
                }
            } catch (err) {
                showStatus('Upload failed: ' + err.message, 'error');
            }

            uploadBtn.textContent = 'Upload';
            uploadBtn.disabled = false;
        });

        async function loadEvent() {
            try {
                const { resp, data } = await AdminAPI.apiJSON('/api/admin/events');
                if (!resp.ok) throw new Error('Failed to load');

                let events;
                if (Array.isArray(data)) {
                    events = data;
                } else if (data.data && data.data.events) {
                    events = data.data.events;
                } else {
                    events = [];
                }

                currentEvent = events.find(e => e.id === eventId);
                if (!currentEvent) {
                    showStatus('Event not found', 'error');
                    return;
                }

                fields.forEach(f => {
                    const el = document.getElementById(f);
                    if (el && currentEvent[f] != null) el.value = currentEvent[f];
                });
                document.getElementById('is_featured').checked = !!currentEvent.is_featured;
                document.getElementById('is_active').checked = currentEvent.is_active !== false;
                updateImagePreview();
            } catch (err) {
                showStatus('Failed to load event: ' + err.message, 'error');
            }
        }

        // Save
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const formData = {};
            fields.forEach(f => {
                const val = document.getElementById(f).value.trim();
                formData[f] = val || null;
            });
            formData.is_featured = document.getElementById('is_featured').checked;
            formData.is_active = document.getElementById('is_active').checked;

            if (!formData.title || !formData.date) {
                showStatus('Title and date are required', 'error');
                btn.disabled = false;
                btn.textContent = 'Save';
                return;
            }

            try {
                let result;
                if (isEdit) {
                    result = await AdminAPI.apiJSON(`/api/admin/events/${eventId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData),
                    });

                    // Fallback to Vercel format
                    if (result.resp.status === 404) {
                        result = await AdminAPI.apiJSON('/api/admin/events', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...formData, id: eventId }),
                        });
                    }
                } else {
                    result = await AdminAPI.apiJSON('/api/admin/events', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData),
                    });
                }

                if (result.resp.ok || result.data.ok) {
                    showStatus('Saved!', 'success');
                    setTimeout(() => { window.location.href = '/admin/'; }, 800);
                } else {
                    showStatus(result.data.error || 'Save failed', 'error');
                }
            } catch (err) {
                showStatus('Network error: ' + err.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Save';
        });

        // Deactivate
        document.getElementById('deactivateBtn').addEventListener('click', async () => {
            if (!confirm('Deactivate this event? It will be hidden from the public calendar.')) return;

            try {
                let result = await AdminAPI.apiJSON(`/api/admin/events/${eventId}`, {
                    method: 'DELETE',
                });

                if (result.resp.status === 404) {
                    result = await AdminAPI.apiJSON('/api/admin/events', {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: eventId, is_active: false }),
                    });
                }

                if (result.resp.ok || result.data.ok) {
                    window.location.href = '/admin/';
                } else {
                    showStatus(result.data.error || 'Failed to deactivate', 'error');
                }
            } catch (err) {
                showStatus('Network error: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
