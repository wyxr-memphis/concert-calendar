<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memphis Live Music — Concert Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wyxr-yellow: #FFCF2D;
            --wyxr-black: #000000;
            --wyxr-white: #FFFFFF;
            --wyxr-charcoal: #1A1A1A;
            --wyxr-gray: #888888;
            --wyxr-dim: #666666;
            --wyxr-border: #2A2A2A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px;
            background: var(--wyxr-black);
            color: var(--wyxr-white);
            line-height: 1.5;
        }

        /* Header */
        header { margin-bottom: 16px; }
        .header-banner {
            width: 100%;
            display: block;
            border-radius: 6px;
        }

        /* Filter Bar — sticky */
        .filter-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--wyxr-black);
            padding: 12px 0;
            border-bottom: 1px solid var(--wyxr-border);
            margin-bottom: 20px;
        }

        /* Month Navigation */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .month-nav button {
            background: none;
            border: 1px solid var(--wyxr-border);
            color: var(--wyxr-white);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .month-nav button:hover { border-color: var(--wyxr-yellow); color: var(--wyxr-yellow); }
        .month-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
        .month-label {
            font-family: 'Anybody', sans-serif;
            font-size: 1.1em;
            font-weight: 700;
            color: var(--wyxr-yellow);
            min-width: 180px;
            text-align: center;
        }

        /* Search */
        .search-row {
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95em;
            border: 1px solid var(--wyxr-border);
            border-radius: 4px;
            background: var(--wyxr-charcoal);
            color: var(--wyxr-white);
            font-family: 'Inter', sans-serif;
        }
        .search-input::placeholder { color: var(--wyxr-dim); }
        .search-input:focus { outline: none; border-color: var(--wyxr-yellow); }

        /* Neighborhood Chips */
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 4px;
        }
        .chip {
            padding: 6px 14px;
            font-size: 0.8em;
            font-weight: 600;
            border: 1px solid var(--wyxr-border);
            border-radius: 20px;
            background: transparent;
            color: var(--wyxr-gray);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .chip:hover { border-color: var(--wyxr-gray); color: var(--wyxr-white); }
        .chip.active {
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            border-color: var(--wyxr-yellow);
        }
        .chip-count {
            font-size: 0.85em;
            opacity: 0.7;
            margin-left: 4px;
        }

        /* Events List */
        .day-section { margin-bottom: 28px; }
        h2 {
            font-family: 'Anybody', sans-serif;
            font-size: 1em;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--wyxr-yellow);
            border-left: 4px solid var(--wyxr-yellow);
            padding-left: 10px;
            margin-bottom: 8px;
        }
        ul { list-style: none; padding: 0; }
        li {
            padding: 5px 0;
            font-size: 0.95em;
            border-bottom: 1px solid var(--wyxr-border);
        }
        li:last-child { border-bottom: none; }
        li.featured, li.event--featured {
            border-left: 3px solid var(--wyxr-yellow);
            padding-left: 8px;
            margin-left: -3px;
        }
        .featured-badge {
            display: inline-block;
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            font-family: 'Anybody', sans-serif;
            font-size: 0.6em;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            vertical-align: middle;
            margin-right: 4px;
        }
        li a { color: inherit; text-decoration: none; }
        li a:hover { color: var(--wyxr-yellow); }
        .artist { font-weight: 600; text-transform: uppercase; }
        .venue { color: #aaa; }
        .time { color: var(--wyxr-gray); font-size: 0.9em; }
        .neighborhood-tag {
            display: inline-block;
            font-size: 0.7em;
            color: var(--wyxr-dim);
            background: var(--wyxr-charcoal);
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 6px;
        }

        /* Venue grouping */
        .venue-group { padding: 5px 0; }
        .venue-artists { list-style: none; padding: 0; }
        .venue-artists li { padding: 2px 0; font-size: 0.95em; border-bottom: none; }
        .venue-footer { font-size: 0.85em; margin-top: 2px; }

        /* States */
        .no-events {
            color: var(--wyxr-dim);
            font-style: italic;
            padding: 40px 0;
            text-align: center;
        }
        .loading-state {
            text-align: center;
            padding: 60px 0;
            color: var(--wyxr-gray);
        }
        .event-count {
            font-size: 0.85em;
            color: var(--wyxr-gray);
            margin-bottom: 16px;
        }

        /* Email Signup Banner */
        .signup-banner {
            background-color: #FFCF2D;
            color: #000000;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            position: relative;
            border-top: 3px solid #000;
            border-bottom: 3px solid #000;
            margin: 0 0 16px 0;
            width: 100%;
            box-sizing: border-box;
        }
        .signup-banner-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .signup-banner-headline {
            font-family: 'Anybody', sans-serif;
            font-weight: 800;
            font-size: 22px;
            line-height: 1.2;
            text-transform: uppercase;
            color: #000000;
        }
        .signup-banner-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: #3D3B3E;
        }
        .signup-banner-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 280px;
        }
        .signup-banner-input-row {
            display: flex;
            gap: 8px;
        }
        .signup-banner-email {
            flex: 1;
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 10px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #000000;
        }
        .signup-banner-email:focus {
            outline: none;
            border-color: #000000;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
        }
        .signup-banner-email::placeholder {
            color: #999;
        }
        .signup-banner-submit {
            background: #000000;
            color: #FFCF2D;
            border: none;
            padding: 10px 20px;
            font-family: 'Anybody', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .signup-banner-submit:hover {
            opacity: 0.9;
        }
        .signup-banner-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .signup-banner-error {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #F54F73;
            margin: 0;
            min-height: 16px;
        }
        .signup-banner-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: #000000;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 8px;
            transition: opacity 0.2s;
        }
        .signup-banner-close:hover {
            opacity: 0.7;
        }
        .signup-banner-success {
            background-color: #FFCF2D;
            color: #000000;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 3px solid #000;
            border-bottom: 3px solid #000;
            margin: 0 0 16px 0;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--wyxr-border);
            font-size: 0.8em;
            color: #555;
            text-align: center;
        }
        footer a { color: var(--wyxr-dim); }
        footer a:hover { color: var(--wyxr-yellow); }

        /* Responsive */
        @media (max-width: 600px) {
            .month-nav { gap: 8px; }
            .month-label { font-size: 0.95em; min-width: 150px; }
            .filter-bar { padding: 8px 0; }

            /* Banner stacks on mobile */
            .signup-banner {
                padding: 16px;
                padding-top: 36px;
            }
            .signup-banner-text {
                width: 100%;
            }
            .signup-banner-headline {
                font-size: 18px;
            }
            .signup-banner-sub {
                font-size: 13px;
            }
            .signup-banner-form {
                width: 100%;
                min-width: unset;
            }
            .signup-banner-input-row {
                flex-direction: column;
            }
            .signup-banner-email,
            .signup-banner-submit {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="/wyxr-wtmm-header.png" alt="WYXR 91.7 FM &amp; Where's the Music Memphis — Concert Calendar" class="header-banner">
    </header>

    <!-- Email Signup Banner -->
    <div class="signup-banner" id="wyxr-signup-banner">
        <div class="signup-banner-text">
            <span class="signup-banner-headline">📬 Never miss a Memphis show.</span>
            <span class="signup-banner-sub">Weekly picks from WYXR DJs — free, every week.</span>
        </div>
        <div class="signup-banner-form">
            <div class="signup-banner-input-row">
                <input
                    type="email"
                    class="signup-banner-email"
                    id="signup-email"
                    placeholder="your@email.com"
                    aria-label="Email address for WYXR weekly picks"
                />
                <button class="signup-banner-submit" type="button" id="signup-submit">Get the List</button>
            </div>
            <p class="signup-banner-error" id="signup-error" aria-live="polite"></p>
        </div>
        <button class="signup-banner-close" id="signup-close" aria-label="Dismiss signup banner">✕</button>
    </div>

    <div class="filter-bar">
        <div class="month-nav">
            <button id="prevMonth">&larr; Prev</button>
            <span class="month-label" id="monthLabel">February 2026</span>
            <button id="nextMonth">Next &rarr;</button>
        </div>
        <div class="search-row">
            <input type="text" class="search-input" id="searchInput" placeholder="Search artists, venues...">
        </div>
        <div class="chip-row" id="chipRow">
            <button class="chip active" data-neighborhood="all">All</button>
        </div>
    </div>

    <div class="loading-state" id="loadingState">Loading events...</div>

    <main id="eventList" style="display:none;">
        <div class="event-count" id="eventCount"></div>
    </main>

    <footer>
        Compiled for WYXR 91.7 FM &middot; Community Radio for Memphis<br>
        <a href="/admin/">Admin</a>
    </footer>

    <script>
    (function() {
        'use strict';

        const API_BASE = 'https://concert-calendar-api.onrender.com';

        // State
        let allEvents = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let activeNeighborhood = 'all';
        let searchQuery = '';
        let searchTimer = null;

        // Month bounds (current month through 6 months ahead)
        const now = new Date();
        const minMonth = now.getMonth();
        const minYear = now.getFullYear();
        const maxDate = new Date(minYear, minMonth + 6, 0);
        const maxMonth = maxDate.getMonth();
        const maxYear = maxDate.getFullYear();

        // DOM refs
        const monthLabel = document.getElementById('monthLabel');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');
        const searchInput = document.getElementById('searchInput');
        const chipRow = document.getElementById('chipRow');
        const eventList = document.getElementById('eventList');
        const eventCount = document.getElementById('eventCount');
        const loadingState = document.getElementById('loadingState');

        // ---- Email Signup Banner ----
        (function initSignupBanner() {
            const banner = document.getElementById('wyxr-signup-banner');
            const emailInput = document.getElementById('signup-email');
            const submitBtn = document.getElementById('signup-submit');
            const errorMsg = document.getElementById('signup-error');
            const closeBtn = document.getElementById('signup-close');

            if (!banner) return;

            // Check session storage on load
            if (sessionStorage.getItem('wyxr_signup_banner_dismissed')) {
                banner.remove();
                return;
            }

            // Show success state if previously submitted
            if (sessionStorage.getItem('wyxr_signup_banner_success')) {
                showSuccessState();
                return;
            }

            // Dismiss handler
            closeBtn.addEventListener('click', () => {
                sessionStorage.setItem('wyxr_signup_banner_dismissed', '1');
                banner.style.transition = 'opacity 0.2s, max-height 0.25s';
                banner.style.opacity = '0';
                banner.style.maxHeight = '0';
                banner.style.overflow = 'hidden';
                banner.style.paddingTop = '0';
                banner.style.paddingBottom = '0';
                setTimeout(() => banner.remove(), 300);
            });

            // Email validation
            function isValidEmail(email) {
                return email.includes('@') && email.includes('.') && email.length > 5;
            }

            // Strip HTML tags from Mailchimp error messages
            function stripHtml(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            // Submit to Mailchimp via hidden iframe (standard embedded form method)
            function submitToMailchimp(email) {
                console.log('[Mailchimp] Starting submission for:', email);

                return new Promise((resolve, reject) => {
                    // Create hidden iframe for form submission
                    const iframe = document.createElement('iframe');
                    iframe.name = 'mailchimp-signup-iframe';
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);

                    // Create form
                    const form = document.createElement('form');
                    form.action = 'https://wyxr.us19.list-manage.com/subscribe/post';
                    form.method = 'POST';
                    form.target = 'mailchimp-signup-iframe';

                    console.log('[Mailchimp] Form action:', form.action);

                    // Add form fields
                    const fields = {
                        'u': '47895ac8529b378064f16c794',
                        'id': '00ff34e7f0',
                        'EMAIL': email,
                        'b_47895ac8529b378064f16c794_00ff34e7f0': '' // Bot honeypot field
                    };

                    Object.entries(fields).forEach(([name, value]) => {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = name;
                        input.value = value;
                        form.appendChild(input);
                    });

                    document.body.appendChild(form);

                    // Handle iframe load (success or error from Mailchimp)
                    iframe.onload = function() {
                        console.log('[Mailchimp] Iframe loaded');
                        try {
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            const bodyText = iframeDoc.body.textContent || iframeDoc.body.innerText || '';
                            console.log('[Mailchimp] Response text:', bodyText.substring(0, 200));

                            // Check for success indicators
                            if (bodyText.toLowerCase().includes('thank') ||
                                bodyText.toLowerCase().includes('almost finished') ||
                                bodyText.toLowerCase().includes('check your email')) {
                                console.log('[Mailchimp] Success detected');
                                resolve('Success! Check your email to confirm your subscription.');
                            }
                            // Check for already subscribed
                            else if (bodyText.toLowerCase().includes('already subscribed') ||
                                     bodyText.toLowerCase().includes('is already a list member')) {
                                console.log('[Mailchimp] Already subscribed detected');
                                resolve('already_subscribed');
                            }
                            // Otherwise assume success (can't read iframe due to CORS)
                            else {
                                console.log('[Mailchimp] No clear response, assuming success');
                                // Assume success if no error detected
                                resolve('Success! Check your email to confirm your subscription.');
                            }
                        } catch (e) {
                            console.log('[Mailchimp] CORS error (expected), assuming success:', e.message);
                            // CORS prevents reading iframe content - assume success
                            resolve('Success! Check your email to confirm your subscription.');
                        }

                        // Cleanup
                        setTimeout(() => {
                            form.remove();
                            iframe.remove();
                        }, 1000);
                    };

                    // Handle timeout
                    setTimeout(() => {
                        reject('Request timed out. Please try again.');
                    }, 10000);

                    // Submit form
                    form.submit();
                });
            }

            // Show success state
            function showSuccessState(message) {
                const successMsg = message || "✅ You're on the list! Check your inbox for this week's Memphis picks.";
                banner.innerHTML = `<div class="signup-banner-success">${successMsg}</div>`;
                sessionStorage.setItem('wyxr_signup_banner_success', '1');
            }

            // Form submission
            async function handleSubmit(e) {
                e.preventDefault();
                const email = emailInput.value.trim();

                // Clear previous errors
                errorMsg.textContent = '';

                // Validate email
                if (!isValidEmail(email)) {
                    errorMsg.textContent = '⚠ Please enter a valid email address.';
                    emailInput.focus();
                    return;
                }

                // Disable form during submission
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';

                try {
                    const response = await submitToMailchimp(email);

                    // Handle "already subscribed" response
                    if (response === 'already_subscribed') {
                        showSuccessState("✅ You're already on the list! 🎶");
                    } else {
                        showSuccessState();
                    }
                } catch (error) {
                    const errorText = typeof error === 'string' ? stripHtml(error) : error.toString();

                    // Handle "already subscribed" as success
                    if (errorText.toLowerCase().includes('already subscribed') ||
                        errorText.toLowerCase().includes('is already a list member')) {
                        showSuccessState("✅ You're already on the list! 🎶");
                    } else {
                        // Show actual error
                        errorMsg.textContent = errorText || 'Something went wrong. Please try again.';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Get the List';
                    }
                }
            }

            // Event listeners
            submitBtn.addEventListener('click', handleSubmit);
            emailInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSubmit(e);
                }
            });
        })();

        // ---- Data Loading ----
        async function loadAllEvents() {
            const startDate = new Date(minYear, minMonth, 1).toISOString().split('T')[0];
            const endDate = new Date(maxYear, maxMonth + 1, 0).toISOString().split('T')[0];

            try {
                const resp = await fetch(
                    `${API_BASE}/api/events?start_date=${startDate}&end_date=${endDate}`
                );
                if (!resp.ok) throw new Error(`API error ${resp.status}`);
                allEvents = await resp.json();
                loadingState.style.display = 'none';
                eventList.style.display = 'block';
                buildChips();
                renderEvents();
            } catch (err) {
                loadingState.textContent = 'Failed to load events. Please refresh.';
                console.error('Load error:', err);
            }
        }

        // ---- Neighborhood Chips ----
        function buildChips() {
            // Count events per neighborhood for current month
            const counts = {};
            let totalInMonth = 0;
            allEvents.forEach(e => {
                const d = new Date(e.date + 'T12:00:00');
                if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                    totalInMonth++;
                    const nh = e.neighborhood || 'Other';
                    counts[nh] = (counts[nh] || 0) + 1;
                }
            });

            // Sort by count descending, "Other" always last
            const sorted = Object.entries(counts).sort((a, b) => {
                if (a[0] === 'Other') return 1;
                if (b[0] === 'Other') return -1;
                return b[1] - a[1];
            });

            chipRow.innerHTML = `<button class="chip${activeNeighborhood === 'all' ? ' active' : ''}" data-neighborhood="all">All<span class="chip-count">${totalInMonth}</span></button>`;

            sorted.forEach(([nh, count]) => {
                const isActive = activeNeighborhood === nh;
                chipRow.innerHTML += `<button class="chip${isActive ? ' active' : ''}" data-neighborhood="${esc(nh)}">${esc(nh)}<span class="chip-count">${count}</span></button>`;
            });

            // Chip click handlers
            chipRow.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeNeighborhood = chip.dataset.neighborhood;
                    chipRow.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    renderEvents();
                });
            });
        }

        // ---- Deduplication ----
        function normalizeForDedup(text) {
            if (!text) return '';
            let s = text.toLowerCase().trim();
            // Remove "the " prefix
            s = s.replace(/^the\s+/g, '');
            // Remove bracketed content
            s = s.replace(/\s*\[([^\]]+)\]\s*/g, ' ');
            s = s.replace(/\s*\(([^\)]+)\)\s*/g, ' ');
            // Remove common words
            s = s.replace(/\s*(live!?|concert|tour|show|presents?|featuring|feat\.?|ft\.?|ep release party?|release party?)\s*/gi, ' ');
            // Replace punctuation with spaces
            s = s.replace(/[^\w\s]/g, ' ');
            // Collapse whitespace
            s = s.replace(/\s+/g, ' ').trim();
            return s;
        }

        function deduplicateEvents(events) {
            // Group by date + venue, then dedupe by normalized title
            const groups = {};
            events.forEach(e => {
                const key = `${e.date}|${normalizeForDedup(e.venue || '')}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(e);
            });

            const deduped = [];
            Object.values(groups).forEach(group => {
                const seen = [];
                group.forEach(event => {
                    const normalized = normalizeForDedup(event.title || '');
                    const isDup = seen.some(s => {
                        const sNorm = normalizeForDedup(s.title || '');
                        // Exact match
                        if (normalized === sNorm) return true;
                        // Space-removed match (handles "slamhound" vs "slam hound")
                        const noSpaceA = normalized.replace(/\s+/g, '');
                        const noSpaceB = sNorm.replace(/\s+/g, '');
                        if (noSpaceA === noSpaceB && noSpaceA.length >= 5) return true;
                        // One contains the other (min length 5)
                        if (normalized.length >= 5 && sNorm.length >= 5) {
                            if (normalized.includes(sNorm) || sNorm.includes(normalized)) return true;
                        }
                        // Word overlap check
                        const wordsA = normalized.split(' ').filter(w => w.length > 2);
                        const wordsB = sNorm.split(' ').filter(w => w.length > 2);
                        if (wordsA.length && wordsB.length) {
                            const intersection = wordsA.filter(w => wordsB.includes(w)).length;
                            const union = new Set([...wordsA, ...wordsB]).size;
                            if (intersection / union > 0.7) return true;
                            // All words from shorter in longer
                            const shorter = wordsA.length <= wordsB.length ? wordsA : wordsB;
                            const longer = wordsA.length <= wordsB.length ? wordsB : wordsA;
                            if (shorter.every(w => longer.includes(w))) return true;
                        }
                        return false;
                    });
                    if (!isDup) {
                        seen.push(event);
                    }
                });
                deduped.push(...seen);
            });

            return deduped;
        }

        // ---- Filtering ----
        function getFilteredEvents() {
            const filtered = allEvents.filter(e => {
                // Month filter
                const d = new Date(e.date + 'T12:00:00');
                if (d.getMonth() !== currentMonth || d.getFullYear() !== currentYear) return false;

                // Neighborhood filter
                if (activeNeighborhood !== 'all') {
                    const nh = e.neighborhood || 'Other';
                    if (nh !== activeNeighborhood) return false;
                }

                // Search filter
                if (searchQuery) {
                    const text = `${e.title || ''} ${e.venue || ''} ${e.neighborhood || ''}`.toLowerCase();
                    if (!text.includes(searchQuery)) return false;
                }

                return true;
            });

            // Deduplicate after filtering
            return deduplicateEvents(filtered);
        }

        // ---- Rendering ----
        function renderEvents() {
            const filtered = getFilteredEvents();

            eventCount.textContent = `${filtered.length} show${filtered.length !== 1 ? 's' : ''} in ${monthNames[currentMonth]} ${currentYear}`;

            if (filtered.length === 0) {
                // Remove old day sections
                eventList.querySelectorAll('.day-section').forEach(s => s.remove());
                eventList.querySelector('.no-events')?.remove();
                const p = document.createElement('p');
                p.className = 'no-events';
                p.textContent = 'No events found for this month with the current filters.';
                eventList.appendChild(p);
                return;
            }

            // Remove old content
            eventList.querySelectorAll('.day-section, .no-events').forEach(s => s.remove());

            // Group by date
            const byDate = {};
            const dateOrder = [];
            filtered.forEach(e => {
                if (!byDate[e.date]) {
                    byDate[e.date] = [];
                    dateOrder.push(e.date);
                }
                byDate[e.date].push(e);
            });
            dateOrder.sort();

            dateOrder.forEach(dateStr => {
                const dayEvents = byDate[dateStr];
                const d = new Date(dateStr + 'T12:00:00');
                const dayName = d.toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric'
                }).toUpperCase();

                // Group by venue
                const venueGroups = {};
                const venueOrder = [];
                dayEvents.forEach(e => {
                    const key = (e.venue || '').toLowerCase();
                    if (!venueGroups[key]) {
                        venueGroups[key] = [];
                        venueOrder.push(key);
                    }
                    venueGroups[key].push(e);
                });

                let eventLines = '';
                venueOrder.forEach(venueKey => {
                    const events = venueGroups[venueKey];

                    if (events.length === 1) {
                        const e = events[0];
                        let line = `<span class="artist">${esc(e.title)}</span> — `;
                        line += `<span class="venue">${esc(e.venue || '')}</span>`;
                        if (e.start_time) line += ` <span class="time">(${esc(e.start_time)})</span>`;

                        const cls = e.is_featured ? ' class="featured event--featured"' : '';
                        const badge = e.is_featured ? '<span class="featured-badge">WYXR Pick</span> ' : '';

                        if (e.ticket_url) {
                            eventLines += `<li${cls}><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${badge}${line}</a></li>`;
                        } else {
                            eventLines += `<li${cls}>${badge}${line}</li>`;
                        }
                    } else {
                        const venueName = events[0].venue || '';
                        const times = events.map(e => e.start_time);
                        const allSameTime = new Set(times).size === 1;
                        const sharedTime = allSameTime ? times[0] : null;

                        let artistItems = '';
                        events.forEach(e => {
                            const badge = e.is_featured ? '<span class="featured-badge">WYXR Pick</span> ' : '';
                            const cls = e.is_featured ? ' class="featured event--featured"' : '';
                            let artistText = `${badge}<span class="artist">${esc(e.title)}</span>`;
                            if (!allSameTime && e.start_time) {
                                artistText += ` <span class="time">(${esc(e.start_time)})</span>`;
                            }
                            if (e.ticket_url) {
                                artistItems += `<li${cls}><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${artistText}</a></li>`;
                            } else {
                                artistItems += `<li${cls}>${artistText}</li>`;
                            }
                        });

                        let footer = `<span class="venue">${esc(venueName)}</span>`;
                        if (sharedTime) footer += ` <span class="time">(${esc(sharedTime)})</span>`;

                        eventLines += `<li class="venue-group"><ul class="venue-artists">${artistItems}</ul><div class="venue-footer">${footer}</div></li>`;
                    }
                });

                const section = document.createElement('div');
                section.className = 'day-section';
                section.innerHTML = `<h2>${dayName}</h2><ul>${eventLines}</ul>`;
                eventList.appendChild(section);
            });
        }

        // ---- Month Navigation ----
        const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function updateMonthDisplay() {
            monthLabel.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // Disable prev if at min
            prevBtn.disabled = (currentYear === minYear && currentMonth <= minMonth);
            // Disable next if at max
            nextBtn.disabled = (currentYear > maxYear || (currentYear === maxYear && currentMonth >= maxMonth));
        }

        prevBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            updateMonthDisplay();
            buildChips();
            renderEvents();
        });

        nextBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            updateMonthDisplay();
            buildChips();
            renderEvents();
        });

        // ---- Search ----
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchQuery = searchInput.value.toLowerCase().trim();
                renderEvents();
            }, 200);
        });

        // ---- HTML Escape ----
        function esc(str) {
            if (!str) return '';
            const el = document.createElement('span');
            el.textContent = str;
            return el.innerHTML;
        }

        // ---- Init ----
        updateMonthDisplay();
        loadAllEvents();
    })();
    </script>
</body>
</html>
