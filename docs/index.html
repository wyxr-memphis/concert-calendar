<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memphis Live Music — Concert Calendar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://concert-calendar-api.onrender.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wyxr-yellow: #FFCF2D;
            --wyxr-black: #000000;
            --wyxr-white: #FFFFFF;
            --wyxr-charcoal: #1A1A1A;
            --wyxr-gray: #888888;
            --wyxr-dim: #666666;
            --wyxr-border: #2A2A2A;
            --wyxr-presents-blue: #5BBCE4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px;
            background: var(--wyxr-black);
            color: var(--wyxr-white);
            line-height: 1.5;
        }

        /* Header */
        header { margin-bottom: 16px; }
        .header-banner {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        /* Filter Bar — sticky */
        .filter-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--wyxr-black);
            padding: 12px 0;
            border-bottom: 1px solid var(--wyxr-border);
            margin-bottom: 20px;
        }

        /* Month Navigation */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .month-nav button {
            background: none;
            border: 1px solid var(--wyxr-border);
            color: var(--wyxr-white);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .month-nav button:hover { border-color: var(--wyxr-yellow); color: var(--wyxr-yellow); }
        .month-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
        .month-label {
            font-family: 'Anybody', sans-serif;
            font-size: 1.1em;
            font-weight: 700;
            color: var(--wyxr-yellow);
            min-width: 180px;
            text-align: center;
        }

        /* Search */
        .search-row {
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95em;
            border: 1px solid var(--wyxr-border);
            border-radius: 4px;
            background: var(--wyxr-charcoal);
            color: var(--wyxr-white);
            font-family: 'Inter', sans-serif;
        }
        .search-input::placeholder { color: var(--wyxr-dim); }
        .search-input:focus { outline: none; border-color: var(--wyxr-yellow); }

        /* Neighborhood Chips */
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 4px;
        }
        .chip {
            padding: 6px 14px;
            font-size: 0.8em;
            font-weight: 600;
            border: 1px solid var(--wyxr-border);
            border-radius: 20px;
            background: transparent;
            color: var(--wyxr-gray);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .chip:hover { border-color: var(--wyxr-gray); color: var(--wyxr-white); }
        .chip.active {
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            border-color: var(--wyxr-yellow);
        }
        .chip-count {
            font-size: 0.85em;
            opacity: 0.7;
            margin-left: 4px;
        }

        /* Events List */
        .day-section { margin-bottom: 28px; }
        h2 {
            font-family: 'Anybody', sans-serif;
            font-size: 1em;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--wyxr-yellow);
            border-left: 4px solid var(--wyxr-yellow);
            padding-left: 10px;
            margin-bottom: 8px;
        }
        ul { list-style: none; padding: 0; }
        li {
            padding: 5px 0;
            font-size: 0.95em;
            border-bottom: 1px solid var(--wyxr-border);
        }
        li:last-child { border-bottom: none; }
        li.featured, li.event--featured {
            border-left: 3px solid var(--wyxr-yellow);
            padding-left: 8px;
            margin-left: -3px;
        }
        .featured-badge {
            display: inline-block;
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            font-family: 'Anybody', sans-serif;
            font-size: 0.6em;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            vertical-align: middle;
            margin-right: 4px;
        }
        li a { color: inherit; text-decoration: none; }
        li a:hover { color: var(--wyxr-yellow); }
        .artist { font-weight: 600; text-transform: uppercase; }
        .venue { color: #aaa; }
        .time { color: var(--wyxr-gray); font-size: 0.9em; }
        .neighborhood-tag {
            display: inline-block;
            font-size: 0.7em;
            color: var(--wyxr-dim);
            background: var(--wyxr-charcoal);
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 6px;
        }

        /* Venue grouping */
        .venue-group { padding: 5px 0; }
        .venue-artists { list-style: none; padding: 0; }
        .venue-artists li { padding: 2px 0; font-size: 0.95em; border-bottom: none; }
        .venue-footer { font-size: 0.85em; margin-top: 2px; }

        /* States */
        .no-events {
            color: var(--wyxr-dim);
            font-style: italic;
            padding: 40px 0;
            text-align: center;
        }
        .loading-state {
            text-align: center;
            padding: 60px 0;
            color: var(--wyxr-gray);
        }
        .event-count {
            font-size: 0.85em;
            color: var(--wyxr-gray);
            margin-bottom: 16px;
        }

        /* Email Signup Banner */
        .signup-banner {
            background-color: #FFCF2D;
            color: #000000;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            position: relative;
            border-top: 3px solid #000;
            border-bottom: 3px solid #000;
            margin: 0 0 16px 0;
            width: 100%;
            box-sizing: border-box;
        }
        .signup-banner-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .signup-banner-headline {
            font-family: 'Anybody', sans-serif;
            font-weight: 800;
            font-size: 22px;
            line-height: 1.2;
            text-transform: uppercase;
            color: #000000;
        }
        .signup-banner-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: #3D3B3E;
        }
        .signup-banner-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 280px;
        }
        .signup-banner-input-row {
            display: flex;
            gap: 8px;
        }
        .signup-banner-email {
            flex: 1;
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 10px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #000000;
        }
        .signup-banner-email:focus {
            outline: none;
            border-color: #000000;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
        }
        .signup-banner-email::placeholder {
            color: #999;
        }
        .signup-banner-submit {
            background: #000000;
            color: #FFCF2D;
            border: none;
            padding: 10px 20px;
            font-family: 'Anybody', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .signup-banner-submit:hover {
            opacity: 0.9;
        }
        .signup-banner-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .signup-banner-error {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #F54F73;
            margin: 0;
            min-height: 16px;
        }
        .signup-banner-success {
            background-color: #FFCF2D;
            color: #000000;
            padding: 20px 24px;
            text-align: center;
            border-top: 3px solid #000;
            border-bottom: 3px solid #000;
            margin: 0 0 16px 0;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Submit Event Button */
        .submit-event-link {
            display: block;
            width: fit-content;
            margin: 12px auto 4px;
            padding: 8px 20px;
            font-family: 'Anybody', sans-serif;
            font-size: 0.85em;
            font-weight: 700;
            color: var(--wyxr-yellow);
            border: 1px solid var(--wyxr-yellow);
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.2s;
        }
        .submit-event-link:hover {
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
        }

        /* WYXR Presents — Pinned Section */
        .presents-section {
            margin-bottom: 24px;
            border: 2px solid var(--wyxr-presents-blue);
            border-radius: 6px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(91, 188, 228, 0.08) 0%, rgba(91, 188, 228, 0.02) 100%);
        }
        .presents-header {
            font-family: 'Anybody', sans-serif;
            font-size: 0.85em;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--wyxr-presents-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .presents-header::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--wyxr-presents-blue);
            border-radius: 50%;
            animation: presents-pulse 2s ease-in-out infinite;
        }
        @keyframes presents-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .presents-badge {
            display: inline-block;
            background: var(--wyxr-presents-blue);
            color: var(--wyxr-black);
            font-family: 'Anybody', sans-serif;
            font-size: 0.65em;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            vertical-align: middle;
            margin-right: 6px;
        }
        .presents-event {
            border-left: 4px solid var(--wyxr-presents-blue);
            padding: 8px 0 8px 12px;
            margin-bottom: 8px;
        }
        .presents-event:last-child { margin-bottom: 0; }
        .presents-event .artist {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--wyxr-presents-blue);
        }
        .presents-event a { color: inherit; text-decoration: none; }
        .presents-event a:hover .artist { text-decoration: underline; }
        .presents-event .date-line {
            font-size: 0.85em;
            color: var(--wyxr-gray);
            margin-top: 2px;
        }

        /* Bottom Search */
        .bottom-search {
            margin: 24px 0;
            padding-top: 16px;
            border-top: 1px solid var(--wyxr-border);
        }

        /* Footer */
        footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--wyxr-border);
            font-size: 0.8em;
            color: #555;
            text-align: center;
        }
        footer a { color: var(--wyxr-dim); }
        footer a:hover { color: var(--wyxr-yellow); }

        /* Top Navigation Bar */
        .top-nav-bar {
            background-color: #1a1a1a;
            color: #C6C5C3;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
            padding: 7px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 1px solid #2e2e2e;
            margin: -20px -16px 16px -16px;
        }
        .top-nav-bar a {
            color: #C6C5C3;
            text-decoration: none;
            transition: color 0.15s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .top-nav-bar a:hover {
            color: var(--wyxr-yellow);
        }
        .top-nav-bar .nav-divider {
            color: #3D3B3E;
            user-select: none;
        }
        .wtmm-short { display: none; }

        /* Responsive */
        @media (max-width: 768px) {
            /* Neighborhood chips - horizontal scroll, no wrap */
            .chip-row {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 8px;
                scrollbar-width: none;
            }
            .chip-row::-webkit-scrollbar {
                display: none;
            }
            .chip {
                flex-shrink: 0;
            }

            /* Signup banner - compact collapsed state */
            .signup-banner {
                padding: 12px 16px;
                cursor: pointer;
                transition: all 0.3s ease;
            }
            .signup-banner-text .signup-banner-sub,
            .signup-banner-form {
                display: none;
            }
            .signup-banner-headline::after {
                content: ' — tap to sign up';
                font-family: 'Inter', sans-serif;
                font-weight: 400;
                font-size: 13px;
                opacity: 0.7;
            }
            .signup-banner.expanded {
                padding: 16px;
                padding-top: 36px;
            }
            .signup-banner.expanded .signup-banner-text .signup-banner-sub,
            .signup-banner.expanded .signup-banner-form {
                display: flex;
            }
            .signup-banner.expanded .signup-banner-headline::after {
                display: none;
            }
            .signup-banner.success {
                cursor: default;
                padding: 10px 16px;
            }

            /* Reduce header bottom margin */
            header {
                margin-bottom: 0;
            }
        }

        @media (max-width: 600px) {
            .month-nav { gap: 8px; }
            .month-label { font-size: 0.95em; min-width: 150px; }
            .filter-bar { padding: 8px 0; }

            /* Banner stacks on mobile when expanded */
            .signup-banner.expanded .signup-banner-text {
                width: 100%;
            }
            .signup-banner.expanded .signup-banner-headline {
                font-size: 18px;
            }
            .signup-banner.expanded .signup-banner-sub {
                font-size: 13px;
            }
            .signup-banner.expanded .signup-banner-form {
                width: 100%;
                min-width: unset;
            }
            .signup-banner.expanded .signup-banner-input-row {
                flex-direction: column;
            }
            .signup-banner.expanded .signup-banner-email,
            .signup-banner.expanded .signup-banner-submit {
                width: 100%;
            }
        }

        @media (max-width: 360px) {
            .wtmm-full { display: none; }
            .wtmm-short { display: inline; }
        }
    </style>
</head>
<body>

    <div class="top-nav-bar">

            <span class="wtmm-full">Where's the Music Memphis</span>

        </a>
    </div>

    <header>
        <picture>
            <source srcset="/wyxr-wtmm-header.webp" type="image/webp">
            <img src="/wyxr-wtmm-header.png" alt="WYXR 91.7 FM &amp; Where's the Music Memphis — Concert Calendar" class="header-banner" width="1200" height="280">
        </picture>
        <a href="/submit" class="submit-event-link">Submit an Event</a>
    </header>

    <!-- Email Signup Banner -->
    <div class="signup-banner" id="wyxr-signup-banner">
        <div class="signup-banner-text">
            <span class="signup-banner-headline">📬 Never miss a Memphis show.</span>
            <span class="signup-banner-sub">Weekly picks from WYXR DJs — free, every week.</span>
        </div>
        <div class="signup-banner-form">
            <div class="signup-banner-input-row">
                <input
                    type="email"
                    class="signup-banner-email"
                    id="signup-email"
                    placeholder="your@email.com"
                    aria-label="Email address for WYXR weekly picks"
                />
                <button class="signup-banner-submit" type="button" id="signup-submit">Get the List</button>
            </div>
            <p class="signup-banner-error" id="signup-error" aria-live="polite"></p>
        </div>
    </div>

    <div class="filter-bar">
        <div class="month-nav">
            <button id="prevMonth">&larr; Prev</button>
            <span class="month-label" id="monthLabel">February 2026</span>
            <button id="nextMonth">Next &rarr;</button>
        </div>
        <div class="chip-row" id="chipRow">
            <button class="chip active" data-neighborhood="all">All</button>
        </div>
    </div>

    <div class="loading-state" id="loadingState">Loading events...</div>

    <main id="eventList" style="display:none;">
        <div class="event-count" id="eventCount"></div>
    </main>

    <div class="bottom-search">
        <input type="text" class="search-input" id="searchInput" placeholder="Search artists, venues...">
    </div>

    <footer>
        Compiled for WYXR 91.7 FM &middot; Community Radio for Memphis<br>
        <a href="/admin/">Admin</a> &middot; <a href="#" id="refreshData">Refresh data</a>
    </footer>

    <script>
    (function() {
        'use strict';

        const API_BASE = 'https://concert-calendar-api.onrender.com';

        // State
        let allEvents = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let activeNeighborhood = 'all';
        let searchQuery = '';
        let searchTimer = null;

        // Month bounds (current month through 6 months ahead)
        const now = new Date();
        const minMonth = now.getMonth();
        const minYear = now.getFullYear();
        const maxDate = new Date(minYear, minMonth + 6, 0);
        const maxMonth = maxDate.getMonth();
        const maxYear = maxDate.getFullYear();

        // DOM refs
        const monthLabel = document.getElementById('monthLabel');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');
        const searchInput = document.getElementById('searchInput');
        const chipRow = document.getElementById('chipRow');
        const eventList = document.getElementById('eventList');
        const eventCount = document.getElementById('eventCount');
        const loadingState = document.getElementById('loadingState');

        // ---- Email Signup Banner ----
        (function initSignupBanner() {
            const banner = document.getElementById('wyxr-signup-banner');
            const emailInput = document.getElementById('signup-email');
            const submitBtn = document.getElementById('signup-submit');
            const errorMsg = document.getElementById('signup-error');

            if (!banner) return;

            // Show success state if previously submitted
            if (sessionStorage.getItem('wyxr_signup_banner_success')) {
                showSuccessState();
                return;
            }

            // Email validation
            function isValidEmail(email) {
                return email.includes('@') && email.includes('.') && email.length > 5;
            }

            // Strip HTML tags from Mailchimp error messages
            function stripHtml(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            // Submit to Mailchimp via hidden iframe (standard embedded form method)
            function submitToMailchimp(email) {
                console.log('[Mailchimp] Starting submission for:', email);

                return new Promise((resolve, reject) => {
                    // Create hidden iframe for form submission
                    const iframe = document.createElement('iframe');
                    iframe.name = 'mailchimp-signup-iframe';
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);

                    // Create form
                    const form = document.createElement('form');
                    form.action = 'https://wyxr.us19.list-manage.com/subscribe/post';
                    form.method = 'POST';
                    form.target = 'mailchimp-signup-iframe';

                    console.log('[Mailchimp] Form action:', form.action);

                    // Add form fields
                    const fields = {
                        'u': '47895ac8529b378064f16c794',
                        'id': 'b1e96a041d',
                        'f_id': '008334e7f0',
                        'EMAIL': email,
                        'b_47895ac8529b378064f16c794_b1e96a041d': '' // Bot honeypot field
                    };

                    Object.entries(fields).forEach(([name, value]) => {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = name;
                        input.value = value;
                        form.appendChild(input);
                    });

                    document.body.appendChild(form);

                    // Handle iframe load (success or error from Mailchimp)
                    iframe.onload = function() {
                        console.log('[Mailchimp] Iframe loaded');
                        try {
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            const bodyText = iframeDoc.body.textContent || iframeDoc.body.innerText || '';
                            console.log('[Mailchimp] Response text:', bodyText.substring(0, 200));

                            // Check for success indicators
                            if (bodyText.toLowerCase().includes('thank') ||
                                bodyText.toLowerCase().includes('almost finished') ||
                                bodyText.toLowerCase().includes('check your email')) {
                                console.log('[Mailchimp] Success detected');
                                resolve('Success! Check your email to confirm your subscription.');
                            }
                            // Check for already subscribed
                            else if (bodyText.toLowerCase().includes('already subscribed') ||
                                     bodyText.toLowerCase().includes('is already a list member')) {
                                console.log('[Mailchimp] Already subscribed detected');
                                resolve('already_subscribed');
                            }
                            // Otherwise assume success (can't read iframe due to CORS)
                            else {
                                console.log('[Mailchimp] No clear response, assuming success');
                                // Assume success if no error detected
                                resolve('Success! Check your email to confirm your subscription.');
                            }
                        } catch (e) {
                            console.log('[Mailchimp] CORS error (expected), assuming success:', e.message);
                            // CORS prevents reading iframe content - assume success
                            resolve('Success! Check your email to confirm your subscription.');
                        }

                        // Cleanup
                        setTimeout(() => {
                            form.remove();
                            iframe.remove();
                        }, 1000);
                    };

                    // Handle timeout
                    setTimeout(() => {
                        reject('Request timed out. Please try again.');
                    }, 10000);

                    // Submit form
                    form.submit();
                });
            }

            // Show success state
            function showSuccessState(message) {
                const successMsg = message || "✅ You're on the list! Check your inbox for this week's Memphis picks.";
                banner.innerHTML = `<p class="signup-banner-success">${successMsg}</p>`;
                sessionStorage.setItem('wyxr_signup_banner_success', '1');
            }

            // Form submission
            async function handleSubmit(e) {
                e.preventDefault();
                const email = emailInput.value.trim();

                // Clear previous errors
                errorMsg.textContent = '';

                // Validate email
                if (!isValidEmail(email)) {
                    errorMsg.textContent = '⚠ Please enter a valid email address.';
                    emailInput.focus();
                    return;
                }

                // Disable form during submission
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';

                try {
                    const response = await submitToMailchimp(email);

                    // Handle "already subscribed" response
                    if (response === 'already_subscribed') {
                        showSuccessState("✅ You're already on the list! 🎶");
                    } else {
                        showSuccessState();
                    }
                } catch (error) {
                    const errorText = typeof error === 'string' ? stripHtml(error) : error.toString();

                    // Handle "already subscribed" as success
                    if (errorText.toLowerCase().includes('already subscribed') ||
                        errorText.toLowerCase().includes('is already a list member')) {
                        showSuccessState("✅ You're already on the list! 🎶");
                    } else {
                        // Show actual error
                        errorMsg.textContent = errorText || 'Something went wrong. Please try again.';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Get the List';
                    }
                }
            }

            // Event listeners
            submitBtn.addEventListener('click', handleSubmit);
            emailInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSubmit(e);
                }
            });
        })();

        // ---- Mobile Banner Expand/Collapse ----
        (function initMobileBannerToggle() {
            // Only attach on mobile
            if (window.innerWidth > 768) return;

            const banner = document.getElementById('wyxr-signup-banner');
            if (!banner) return;

            // Skip if already successful (banner won't be in collapsed state)
            if (sessionStorage.getItem('wyxr_signup_banner_success')) return;

            // Expand when tapping banner (but not the submit button or input)
            banner.addEventListener('click', (e) => {
                // Don't expand if clicking input or button
                if (e.target.closest('.signup-banner-email')) return;
                if (e.target.closest('.signup-banner-submit')) return;

                // Expand banner
                if (!banner.classList.contains('expanded')) {
                    banner.classList.add('expanded');
                }
            });
        })();

        // ---- Data Loading (stale-while-revalidate with localStorage) ----
        const CACHE_KEY = 'wyxr_events_cache';

        function getCachedEvents() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch { return null; }
        }

        function setCachedEvents(events) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(events));
            } catch { /* quota exceeded — ignore */ }
        }

        function showEvents(events) {
            allEvents = events;
            loadingState.style.display = 'none';
            eventList.style.display = 'block';
            buildChips();
            renderEvents();
        }

        async function fetchFreshEvents(bustCache) {
            const startDate = new Date(minYear, minMonth, 1).toISOString().split('T')[0];
            const endDate = new Date(maxYear, maxMonth + 1, 0).toISOString().split('T')[0];
            let url = `${API_BASE}/api/events?start_date=${startDate}&end_date=${endDate}`;
            if (bustCache) url += `&_t=${Date.now()}`;

            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`API error ${resp.status}`);
            return resp.json();
        }

        async function loadAllEvents() {
            // 1. Instant render from cache if available
            const cached = getCachedEvents();
            if (cached && cached.length > 0) {
                showEvents(cached);
            }

            // 2. Fetch fresh data in background
            try {
                const fresh = await fetchFreshEvents(false);
                const changed = JSON.stringify(fresh) !== JSON.stringify(allEvents);
                setCachedEvents(fresh);
                if (changed) showEvents(fresh);
            } catch (err) {
                if (!cached || cached.length === 0) {
                    loadingState.textContent = 'Failed to load events. Please refresh.';
                } else {
                    console.warn('API fetch failed, showing cached data:', err);
                }
            }
        }

        // "Refresh data" link — clears cache and forces fresh fetch
        document.getElementById('refreshData')?.addEventListener('click', async (e) => {
            e.preventDefault();
            localStorage.removeItem(CACHE_KEY);
            loadingState.textContent = 'Refreshing...';
            loadingState.style.display = 'block';
            try {
                const fresh = await fetchFreshEvents(true);
                setCachedEvents(fresh);
                showEvents(fresh);
            } catch (err) {
                loadingState.textContent = 'Failed to refresh. Please try again.';
                console.error('Refresh error:', err);
            }
        });

        // ---- Neighborhood Chips ----
        function buildChips() {
            // Count events per neighborhood for current month
            const counts = {};
            let totalInMonth = 0;
            allEvents.forEach(e => {
                const d = new Date(e.date + 'T12:00:00');
                if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                    totalInMonth++;
                    const nh = e.neighborhood || 'Other';
                    counts[nh] = (counts[nh] || 0) + 1;
                }
            });

            // Sort by count descending, "Other" always last
            const sorted = Object.entries(counts).sort((a, b) => {
                if (a[0] === 'Other') return 1;
                if (b[0] === 'Other') return -1;
                return b[1] - a[1];
            });

            chipRow.innerHTML = `<button class="chip${activeNeighborhood === 'all' ? ' active' : ''}" data-neighborhood="all">All<span class="chip-count">${totalInMonth}</span></button>`;

            sorted.forEach(([nh, count]) => {
                const isActive = activeNeighborhood === nh;
                chipRow.innerHTML += `<button class="chip${isActive ? ' active' : ''}" data-neighborhood="${esc(nh)}">${esc(nh)}<span class="chip-count">${count}</span></button>`;
            });

            // Chip click handlers
            chipRow.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeNeighborhood = chip.dataset.neighborhood;
                    chipRow.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    renderEvents();
                });
            });
        }

        // ---- Deduplication ----
        function normalizeForDedup(text) {
            if (!text) return '';
            let s = text.toLowerCase().trim();
            // Remove "the " prefix
            s = s.replace(/^the\s+/g, '');
            // Remove bracketed content
            s = s.replace(/\s*\[([^\]]+)\]\s*/g, ' ');
            s = s.replace(/\s*\(([^\)]+)\)\s*/g, ' ');
            // Remove common words
            s = s.replace(/\s*(live!?|concert|tour|show|presents?|featuring|feat\.?|ft\.?|ep release party?|release party?)\s*/gi, ' ');
            // Replace punctuation with spaces
            s = s.replace(/[^\w\s]/g, ' ');
            // Collapse whitespace
            s = s.replace(/\s+/g, ' ').trim();
            return s;
        }

        function deduplicateEvents(events) {
            // Group by date + venue, then dedupe by normalized title
            const groups = {};
            events.forEach(e => {
                const key = `${e.date}|${normalizeForDedup(e.venue || '')}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(e);
            });

            const deduped = [];
            Object.values(groups).forEach(group => {
                const seen = [];
                group.forEach(event => {
                    const normalized = normalizeForDedup(event.title || '');
                    const isDup = seen.some(s => {
                        const sNorm = normalizeForDedup(s.title || '');
                        // Exact match
                        if (normalized === sNorm) return true;
                        // Space-removed match (handles "slamhound" vs "slam hound")
                        const noSpaceA = normalized.replace(/\s+/g, '');
                        const noSpaceB = sNorm.replace(/\s+/g, '');
                        if (noSpaceA === noSpaceB && noSpaceA.length >= 5) return true;
                        // One contains the other (min length 5)
                        if (normalized.length >= 5 && sNorm.length >= 5) {
                            if (normalized.includes(sNorm) || sNorm.includes(normalized)) return true;
                        }
                        // Word overlap check
                        const wordsA = normalized.split(' ').filter(w => w.length > 2);
                        const wordsB = sNorm.split(' ').filter(w => w.length > 2);
                        if (wordsA.length && wordsB.length) {
                            const intersection = wordsA.filter(w => wordsB.includes(w)).length;
                            const union = new Set([...wordsA, ...wordsB]).size;
                            if (intersection / union > 0.7) return true;
                            // All words from shorter in longer
                            const shorter = wordsA.length <= wordsB.length ? wordsA : wordsB;
                            const longer = wordsA.length <= wordsB.length ? wordsB : wordsA;
                            if (shorter.every(w => longer.includes(w))) return true;
                        }
                        return false;
                    });
                    if (!isDup) {
                        seen.push(event);
                    }
                });
                deduped.push(...seen);
            });

            return deduped;
        }

        // ---- Filtering ----
        function getFilteredEvents() {
            const filtered = allEvents.filter(e => {
                // Month filter
                const d = new Date(e.date + 'T12:00:00');
                if (d.getMonth() !== currentMonth || d.getFullYear() !== currentYear) return false;

                // Neighborhood filter
                if (activeNeighborhood !== 'all') {
                    const nh = e.neighborhood || 'Other';
                    if (nh !== activeNeighborhood) return false;
                }

                // Search filter
                if (searchQuery) {
                    const text = `${e.title || ''} ${e.venue || ''} ${e.neighborhood || ''}`.toLowerCase();
                    if (!text.includes(searchQuery)) return false;
                }

                return true;
            });

            // Deduplicate after filtering
            return deduplicateEvents(filtered);
        }

        // ---- Rendering ----
        function renderPresentsSection() {
            // Remove old presents section
            eventList.querySelector('.presents-section')?.remove();

            const todayStr = new Date().toISOString().split('T')[0];
            const presentsEvents = allEvents.filter(e => {
                if (!e.is_wyxr_presents || e.is_active === false) return false;
                if (e.date < todayStr) return false;
                // Apply search filter
                if (searchInput.value.trim()) {
                    const query = searchInput.value.trim().toLowerCase();
                    const text = `${e.title || ''} ${e.venue || ''} ${e.neighborhood || ''}`.toLowerCase();
                    if (!text.includes(query)) return false;
                }
                // Apply neighborhood filter
                const activeChip = document.querySelector('.chip.active');
                const activeNeighborhood = activeChip ? activeChip.dataset.neighborhood : 'all';
                if (activeNeighborhood !== 'all') {
                    const nh = e.neighborhood || 'Other';
                    if (nh !== activeNeighborhood) return false;
                }
                return true;
            });

            if (presentsEvents.length === 0) return;

            let presentsHtml = '';
            presentsEvents.forEach(e => {
                const d = new Date(e.date + 'T12:00:00');
                const dateStr = d.toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric'
                });
                let line = `<span class="artist">${esc(e.title)}</span>`;
                line += ` <span class="venue">@ ${esc(e.venue || '')}</span>`;
                const dateLine = `<div class="date-line">${dateStr}${e.start_time ? ' &middot; ' + esc(e.start_time) : ''}</div>`;

                if (e.ticket_url) {
                    presentsHtml += `<div class="presents-event"><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener"><span class="presents-badge">WYXR Presents</span>${line}</a>${dateLine}</div>`;
                } else {
                    presentsHtml += `<div class="presents-event"><span class="presents-badge">WYXR Presents</span>${line}${dateLine}</div>`;
                }
            });

            const presentsSection = document.createElement('div');
            presentsSection.className = 'presents-section';
            presentsSection.innerHTML = `<div class="presents-header">WYXR Presents</div>${presentsHtml}`;
            eventList.insertBefore(presentsSection, eventList.querySelector('.event-count')?.nextSibling || eventList.querySelector('.day-section') || eventList.firstChild);
        }

        function renderEvents() {
            const filtered = getFilteredEvents();

            eventCount.textContent = `${filtered.length} show${filtered.length !== 1 ? 's' : ''} in ${monthNames[currentMonth]} ${currentYear}`;

            if (filtered.length === 0) {
                // Remove old day sections
                eventList.querySelectorAll('.day-section').forEach(s => s.remove());
                eventList.querySelector('.no-events')?.remove();
                const p = document.createElement('p');
                p.className = 'no-events';
                p.textContent = 'No events found for this month with the current filters.';
                eventList.appendChild(p);
                renderPresentsSection();
                return;
            }

            // Remove old content
            eventList.querySelectorAll('.day-section, .no-events').forEach(s => s.remove());

            // Group by date
            const byDate = {};
            const dateOrder = [];
            filtered.forEach(e => {
                if (!byDate[e.date]) {
                    byDate[e.date] = [];
                    dateOrder.push(e.date);
                }
                byDate[e.date].push(e);
            });
            dateOrder.sort();

            dateOrder.forEach(dateStr => {
                const dayEvents = byDate[dateStr];
                const d = new Date(dateStr + 'T12:00:00');
                const dayName = d.toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric'
                }).toUpperCase();

                // Group by venue
                const venueGroups = {};
                const venueOrder = [];
                dayEvents.forEach(e => {
                    const key = (e.venue || '').toLowerCase();
                    if (!venueGroups[key]) {
                        venueGroups[key] = [];
                        venueOrder.push(key);
                    }
                    venueGroups[key].push(e);
                });

                let eventLines = '';
                venueOrder.forEach(venueKey => {
                    const events = venueGroups[venueKey];

                    if (events.length === 1) {
                        const e = events[0];
                        let line = `<span class="artist">${esc(e.title)}</span> — `;
                        line += `<span class="venue">${esc(e.venue || '')}</span>`;
                        if (e.start_time) line += ` <span class="time">(${esc(e.start_time)})</span>`;

                        const cls = (e.is_wyxr_presents || e.is_featured) ? ' class="featured event--featured"' : '';
                        const badge = e.is_wyxr_presents ? '<span class="presents-badge">WYXR Presents</span> '
                            : e.is_featured ? '<span class="featured-badge">WYXR Pick</span> ' : '';

                        if (e.ticket_url) {
                            eventLines += `<li${cls}><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${badge}${line}</a></li>`;
                        } else {
                            eventLines += `<li${cls}>${badge}${line}</li>`;
                        }
                    } else {
                        const venueName = events[0].venue || '';
                        const times = events.map(e => e.start_time);
                        const allSameTime = new Set(times).size === 1;
                        const sharedTime = allSameTime ? times[0] : null;

                        let artistItems = '';
                        events.forEach(e => {
                            const badge = e.is_wyxr_presents ? '<span class="presents-badge">WYXR Presents</span> '
                                : e.is_featured ? '<span class="featured-badge">WYXR Pick</span> ' : '';
                            const cls = (e.is_wyxr_presents || e.is_featured) ? ' class="featured event--featured"' : '';
                            let artistText = `${badge}<span class="artist">${esc(e.title)}</span>`;
                            if (!allSameTime && e.start_time) {
                                artistText += ` <span class="time">(${esc(e.start_time)})</span>`;
                            }
                            if (e.ticket_url) {
                                artistItems += `<li${cls}><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${artistText}</a></li>`;
                            } else {
                                artistItems += `<li${cls}>${artistText}</li>`;
                            }
                        });

                        let footer = `<span class="venue">${esc(venueName)}</span>`;
                        if (sharedTime) footer += ` <span class="time">(${esc(sharedTime)})</span>`;

                        eventLines += `<li class="venue-group"><ul class="venue-artists">${artistItems}</ul><div class="venue-footer">${footer}</div></li>`;
                    }
                });

                const section = document.createElement('div');
                section.className = 'day-section';
                section.innerHTML = `<h2>${dayName}</h2><ul>${eventLines}</ul>`;
                eventList.appendChild(section);
            });

            renderPresentsSection();
        }

        // ---- Month Navigation ----
        const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function updateMonthDisplay() {
            monthLabel.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // Disable prev if at min
            prevBtn.disabled = (currentYear === minYear && currentMonth <= minMonth);
            // Disable next if at max
            nextBtn.disabled = (currentYear > maxYear || (currentYear === maxYear && currentMonth >= maxMonth));
        }

        prevBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            updateMonthDisplay();
            buildChips();
            renderEvents();
        });

        nextBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            updateMonthDisplay();
            buildChips();
            renderEvents();
        });

        // ---- Search ----
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchQuery = searchInput.value.toLowerCase().trim();
                renderEvents();
            }, 200);
        });

        // ---- HTML Escape ----
        function esc(str) {
            if (!str) return '';
            const el = document.createElement('span');
            el.textContent = str;
            return el.innerHTML;
        }

        // ---- Init ----
        updateMonthDisplay();
        loadAllEvents();
    })();
    </script>
