    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://concert-calendar-api.onrender.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wyxr-yellow: #FFCF2D;
            --wyxr-black: #000000;
            --wyxr-white: #FFFFFF;
            --wyxr-charcoal: #1A1A1A;
            --wyxr-gray: #888888;
            --wyxr-dim: #666666;
            --wyxr-border: #2A2A2A;
            --wyxr-presents-blue: #5BBCE4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px;
            background: var(--wyxr-black);
            color: var(--wyxr-white);
            line-height: 1.5;
        }

        /* Header */
        header { margin-bottom: 16px; }
        .header-banner {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        /* Filter Bar — sticky */
        .filter-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--wyxr-black);
            padding: 12px 0;
            border-bottom: 1px solid var(--wyxr-border);
            margin-bottom: 20px;
        }

        /* Month Navigation */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .month-nav button {
            background: none;
            border: 1px solid var(--wyxr-border);
            color: var(--wyxr-white);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .month-nav button:hover { border-color: var(--wyxr-yellow); color: var(--wyxr-yellow); }
        .month-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
        .month-label {
            font-family: 'Anybody', sans-serif;
            font-size: 1.1em;
            font-weight: 700;
            color: var(--wyxr-yellow);
            min-width: 180px;
            text-align: center;
        }

        /* Search */
        .search-row {
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95em;
            border: 1px solid var(--wyxr-border);
            border-radius: 4px;
            background: var(--wyxr-charcoal);
            color: var(--wyxr-white);
            font-family: 'Inter', sans-serif;
        }
        .search-input::placeholder { color: var(--wyxr-dim); }
        .search-input:focus { outline: none; border-color: var(--wyxr-yellow); }

        /* Neighborhood Chips */
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 4px;
        }
        .chip {
            padding: 6px 14px;
            font-size: 0.8em;
            font-weight: 600;
            border: 1px solid var(--wyxr-border);
            border-radius: 20px;
            background: transparent;
            color: var(--wyxr-gray);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .chip:hover { border-color: var(--wyxr-gray); color: var(--wyxr-white); }
        .chip.active {
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            border-color: var(--wyxr-yellow);
        }
        .chip-count {
            font-size: 0.85em;
            opacity: 0.7;
            margin-left: 4px;
        }

        /* Events List */
        .day-section { margin-bottom: 28px; }
        .sponsor-callout {
            margin: 1rem 0 2rem;
            position: relative;
            max-width: 500px;
        }
        .sponsor-callout .sponsor-label {
            font-size: 0.65rem;
            color: var(--wyxr-gray);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
            display: block;
        }
        .sponsor-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }
        /* Inline Subscribe Callout */
        .subscribe-callout {
            margin: 1rem 0 2rem;
            max-width: 500px;
            padding: 16px 20px;
            border: 1px solid var(--wyxr-border);
            border-left: 3px solid var(--wyxr-yellow);
            border-radius: 4px;
            background: var(--wyxr-charcoal);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .subscribe-callout:hover { border-color: var(--wyxr-yellow); }
        .subscribe-callout-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.85em;
            color: var(--wyxr-gray);
            line-height: 1.5;
        }
        .subscribe-callout-cta {
            display: inline;
            font-family: 'Anybody', sans-serif;
            font-weight: 700;
            font-size: 0.85em;
            color: var(--wyxr-yellow);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-left: 4px;
        }
        h2 {
            font-family: 'Anybody', sans-serif;
            font-size: 1em;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--wyxr-yellow);
            border-left: 4px solid var(--wyxr-yellow);
            padding-left: 10px;
            margin-bottom: 8px;
        }
        ul { list-style: none; padding: 0; }
        li {
            padding: 5px 0;
            font-size: 0.95em;
            border-bottom: 1px solid var(--wyxr-border);
        }
        li:last-child { border-bottom: none; }
        li.featured, li.event--featured {
            padding-left: 10px;
        }
        .featured-badge {
            display: inline-block;
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            font-family: 'Anybody', sans-serif;
            font-size: 0.6em;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            vertical-align: middle;
            margin-right: 4px;
        }
        .featured-group {
            border: 1px solid #3a3a3a;
            border-left: 3px solid #E85D4A;
            border-radius: 4px;
            padding: 14px 16px 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
        }
        .featured-group .venue-artists { margin: 0; padding-left: 10px; }
        .featured-group .venue-artists li { padding: 5px 0; }
        .featured-group .venue-artists li:last-child { border-bottom: none; }
        .featured-group-header { margin-bottom: 8px; }
        .featured-group-header .featured-badge {
            background: #E85D4A;
            color: #fff;
        }
        li a { color: inherit; text-decoration: none; }
        li a:hover { color: var(--wyxr-yellow); }
        .artist { font-weight: 600; text-transform: uppercase; }
        .venue { color: #aaa; }
        .time { color: var(--wyxr-gray); font-size: 0.9em; }
        .neighborhood-tag {
            display: inline-block;
            font-size: 0.7em;
            color: var(--wyxr-dim);
            background: var(--wyxr-charcoal);
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 6px;
        }

        /* Venue grouping */
        .venue-group { padding: 5px 0; }
        .venue-artists { list-style: none; padding: 0; }
        .venue-artists li { padding: 2px 0; font-size: 0.95em; border-bottom: none; }
        .venue-footer { font-size: 0.85em; margin-top: 2px; }

        /* States */
        .no-events {
            color: var(--wyxr-dim);
            font-style: italic;
            padding: 40px 0;
            text-align: center;
        }
        .loading-state {
            text-align: center;
            padding: 60px 0;
            color: var(--wyxr-gray);
        }
        .event-count {
            font-size: 0.85em;
            color: var(--wyxr-gray);
            margin-bottom: 16px;
        }

        /* Subscribe link (in header, next to Submit an Event) */
        .subscribe-link {
            display: inline-block;
            margin-left: 10px;
            padding: 8px 16px;
            font-family: 'Anybody', sans-serif;
            font-size: 0.85em;
            font-weight: 700;
            color: var(--wyxr-gray);
            border: 1px solid var(--wyxr-border);
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            cursor: pointer;
            background: none;
        }
        .subscribe-link:hover {
            border-color: var(--wyxr-gray);
            color: var(--wyxr-white);
        }
        .header-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px auto 4px;
        }

        /* Subscribe modal */
        .subscribe-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .subscribe-modal.open { display: flex; }
        .subscribe-modal-card {
            background: #1A1A1A;
            border: 1px solid var(--wyxr-border);
            border-radius: 8px;
            padding: 28px 24px 24px;
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        .subscribe-modal-close {
            position: absolute;
            top: 12px; right: 14px;
            background: none;
            border: none;
            color: var(--wyxr-gray);
            font-size: 1.4em;
            cursor: pointer;
            line-height: 1;
        }
        .subscribe-modal-close:hover { color: var(--wyxr-white); }
        .subscribe-modal-title {
            font-family: 'Anybody', sans-serif;
            font-size: 1.1em;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .subscribe-modal-sub {
            font-size: 0.85em;
            color: var(--wyxr-dim);
            margin-bottom: 16px;
        }
        .subscribe-modal-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .subscribe-modal-input-row {
            display: flex;
            gap: 8px;
        }
        .subscribe-modal-email {
            flex: 1;
            background: var(--wyxr-charcoal);
            border: 1px solid var(--wyxr-border);
            border-radius: 4px;
            padding: 10px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            color: var(--wyxr-white);
        }
        .subscribe-modal-email:focus {
            outline: none;
            border-color: var(--wyxr-yellow);
        }
        .subscribe-modal-email::placeholder { color: var(--wyxr-dim); }
        .subscribe-modal-submit {
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            border: none;
            padding: 10px 18px;
            font-family: 'Anybody', sans-serif;
            font-weight: 700;
            font-size: 0.85em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .subscribe-modal-submit:hover { opacity: 0.88; }
        .subscribe-modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .subscribe-modal-error {
            font-size: 0.8em;
            color: #F54F73;
            min-height: 16px;
        }
        .subscribe-modal-success {
            text-align: center;
            padding: 12px 0 4px;
            font-size: 0.95em;
            color: var(--wyxr-white);
            line-height: 1.5;
        }

        /* Calendar Sponsor Banner */
        #calendarSponsorBanner {
            margin: 0 0 20px;
            text-align: center;
        }
        .cal-sponsor-label {
            display: block;
            font-size: 0.65rem;
            color: var(--wyxr-gray);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .cal-sponsor-img {
            display: block;
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 4px;
            margin: 0 auto;
        }
        .cal-sponsor-copy {
            margin-top: 6px;
            font-size: 0.8em;
            color: var(--wyxr-dim);
            font-style: italic;
        }

        /* Submit Event Button */
        .submit-event-link {
            display: inline-block;
            width: fit-content;
            padding: 8px 20px;
            font-family: 'Anybody', sans-serif;
            font-size: 0.85em;
            font-weight: 700;
            color: var(--wyxr-yellow);
            border: 1px solid var(--wyxr-yellow);
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transition: all 0.2s;
        }
        .submit-event-link:hover {
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
        }

        /* WYXR Presents — Pinned Section */
        .presents-section {
            margin-bottom: 24px;
            border: 2px solid var(--wyxr-presents-blue);
            border-radius: 6px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(91, 188, 228, 0.08) 0%, rgba(91, 188, 228, 0.02) 100%);
        }
        .presents-header {
            font-family: 'Anybody', sans-serif;
            font-size: 0.85em;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--wyxr-presents-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .presents-header::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--wyxr-presents-blue);
            border-radius: 50%;
            animation: presents-pulse 2s ease-in-out infinite;
        }
        @keyframes presents-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .presents-badge {
            display: inline-block;
            background: var(--wyxr-presents-blue);
            color: var(--wyxr-black);
            font-family: 'Anybody', sans-serif;
            font-size: 0.65em;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            vertical-align: middle;
            margin-right: 6px;
        }
        .presents-event {
            border-left: 4px solid var(--wyxr-presents-blue);
            padding: 8px 0 8px 12px;
            margin-bottom: 8px;
        }
        .presents-event:last-child { margin-bottom: 0; }
        .presents-event .artist {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--wyxr-white);
        }
        .presents-event a { color: inherit; text-decoration: none; }
        .presents-event a:hover .artist { text-decoration: underline; }
        .presents-event .date-line {
            font-size: 0.85em;
            color: var(--wyxr-gray);
            margin-top: 2px;
        }

        /* Bottom Search */
        .bottom-search {
            margin: 24px 0;
            padding-top: 16px;
            border-top: 1px solid var(--wyxr-border);
        }

        /* Footer */
        footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--wyxr-border);
            font-size: 0.8em;
            color: #555;
            text-align: center;
        }
        footer a { color: var(--wyxr-dim); }
        footer a:hover { color: var(--wyxr-yellow); }

        /* Sticky Subscribe Footer */
        .subscribe-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 50;
            background: var(--wyxr-charcoal);
            border-top: 1px solid var(--wyxr-yellow);
            transform: translateY(100%);
            transition: transform 0.35s ease-out;
            padding: 0 16px;
        }
        .subscribe-footer.visible { transform: translateY(0); }
        .subscribe-footer-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 46px;
        }
        .subscribe-footer-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.85em;
            font-weight: 500;
            color: var(--wyxr-white);
            white-space: nowrap;
        }
        .subscribe-footer-cta {
            background: var(--wyxr-yellow);
            color: var(--wyxr-black);
            border: none;
            padding: 6px 18px;
            font-family: 'Anybody', sans-serif;
            font-weight: 700;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .subscribe-footer-cta:hover { opacity: 0.88; }
        .subscribe-footer-close {
            background: none;
            border: none;
            color: var(--wyxr-gray);
            font-size: 1.2em;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }
        .subscribe-footer-close:hover { color: var(--wyxr-white); }
        body.has-subscribe-footer { padding-bottom: 50px; }

        /* Top Navigation Bar */
        .top-nav-bar {
            background-color: #1a1a1a;
            color: #C6C5C3;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
            padding: 7px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 1px solid #2e2e2e;
            margin: -20px -16px 16px -16px;
        }
        .top-nav-bar a {
            color: #C6C5C3;
            text-decoration: none;
            transition: color 0.15s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .top-nav-bar a:hover {
            color: var(--wyxr-yellow);
        }
        .top-nav-bar .nav-divider {
            color: #3D3B3E;
            user-select: none;
        }
        .wtmm-short { display: none; }

        /* Responsive */
        @media (max-width: 768px) {
            /* Neighborhood chips - horizontal scroll, no wrap */
            .chip-row {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 8px;
                scrollbar-width: none;
            }
            .chip-row::-webkit-scrollbar {
                display: none;
            }
            .chip {
                flex-shrink: 0;
            }

            /* Reduce header bottom margin */
            header {
                margin-bottom: 0;
            }
            .subscribe-footer-inner { height: 42px; gap: 8px; }
            .subscribe-footer-text { font-size: 0.78em; }
            .subscribe-footer-cta { padding: 5px 14px; font-size: 0.75em; }
        }

        @media (max-width: 600px) {
            .month-nav { gap: 8px; }
            .month-label { font-size: 0.95em; min-width: 150px; }
            .filter-bar { padding: 8px 0; }
        }

        @media (max-width: 360px) {
            .wtmm-full { display: none; }
            .wtmm-short { display: inline; }
            .subscribe-footer-text { display: none; }
            .subscribe-footer-inner::before { content: '\1F4E7'; font-size: 1em; }
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-nav-bar">
        <a href="https://wyxr.org" target="_blank" rel="noopener">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

            </svg>
            WYXR 91.7 FM
        </a>
        <span class="nav-divider">·</span>

    <script>
    (function() {
        'use strict';

        const API_BASE = 'https://concert-calendar-api.onrender.com';

        // State
        let openSubscribeModal = null;
        let allEvents = [];
        let allSponsors = [];
        let calendarSponsor = null;
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let activeNeighborhood = 'all';
        let searchQuery = '';
        let searchTimer = null;

        // Month bounds (current month through 6 months ahead)
        const now = new Date();
        const minMonth = now.getMonth();
        const minYear = now.getFullYear();
        const maxDate = new Date(minYear, minMonth + 6, 0);
        const maxMonth = maxDate.getMonth();
        const maxYear = maxDate.getFullYear();

        // DOM refs
        const monthLabel = document.getElementById('monthLabel');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');
        const searchInput = document.getElementById('searchInput');
        const chipRow = document.getElementById('chipRow');
        const eventList = document.getElementById('eventList');
        const eventCount = document.getElementById('eventCount');
        const loadingState = document.getElementById('loadingState');

        // ---- Subscribe Modal ----
        (function initSubscribeModal() {
            const modal = document.getElementById('subscribeModal');
            const openBtn = document.getElementById('subscribeBtn');
            const closeBtn = document.getElementById('subscribeModalClose');
            const emailInput = document.getElementById('subscribe-email');
            const submitBtn = document.getElementById('subscribe-submit');
            const errorMsg = document.getElementById('subscribe-error');
            const form = document.getElementById('subscribeForm');

            if (!modal || !openBtn) return;

            // If already subscribed, hide the button or show checkmark
            if (sessionStorage.getItem('wyxr_signup_banner_success')) {
                openBtn.textContent = '✓ Subscribed';
                openBtn.disabled = true;
                openBtn.style.opacity = '0.5';
                return;
            }

            function openModal() {
                modal.classList.add('open');
                setTimeout(() => emailInput && emailInput.focus(), 50);
            }
            openSubscribeModal = openModal;

            function closeModal() {
                modal.classList.remove('open');
            }

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            function isValidEmail(email) {
                return email.includes('@') && email.includes('.') && email.length > 5;
            }

            function submitToMailchimp(email) {
                return new Promise((resolve, reject) => {
                    const iframe = document.createElement('iframe');
                    iframe.name = 'mailchimp-signup-iframe';
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);

                    const formEl = document.createElement('form');
                    formEl.action = 'https://wyxr.us19.list-manage.com/subscribe/post';
                    formEl.method = 'POST';
                    formEl.target = 'mailchimp-signup-iframe';

                    const fields = {
                        'u': '47895ac8529b378064f16c794',
                        'id': 'b1e96a041d',
                        'f_id': '008334e7f0',
                        'EMAIL': email,
                        'b_47895ac8529b378064f16c794_b1e96a041d': ''
                    };

                    Object.entries(fields).forEach(([name, value]) => {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = name;
                        input.value = value;
                        formEl.appendChild(input);
                    });

                    document.body.appendChild(formEl);

                    iframe.onload = function() {
                        try {
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            const bodyText = iframeDoc.body.textContent || iframeDoc.body.innerText || '';
                            if (bodyText.toLowerCase().includes('already subscribed') ||
                                bodyText.toLowerCase().includes('is already a list member')) {
                                resolve('already_subscribed');
                            } else {
                                resolve('success');
                            }
                        } catch (e) {
                            resolve('success');
                        }
                        setTimeout(() => { formEl.remove(); iframe.remove(); }, 1000);
                    };

                    setTimeout(() => reject('Request timed out. Please try again.'), 10000);
                    formEl.submit();
                });
            }

            function showSuccess(message) {
                form.innerHTML = `<p class="subscribe-modal-success">${message}</p>`;
                sessionStorage.setItem('wyxr_signup_banner_success', '1');
                openBtn.textContent = '✓ Subscribed';
                openBtn.disabled = true;
                openBtn.style.opacity = '0.5';
            }

            async function handleSubmit(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                errorMsg.textContent = '';

                if (!isValidEmail(email)) {
                    errorMsg.textContent = '⚠ Please enter a valid email address.';
                    emailInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';

                try {
                    const response = await submitToMailchimp(email);
                    if (response === 'already_subscribed') {
                        showSuccess("✅ You're already on the list! 🎶");
                    } else {
                        showSuccess("✅ You're on the list! Check your inbox for this week's Memphis picks.");
                    }
                } catch (error) {
                    const errorText = typeof error === 'string' ? error : error.toString();
                    if (errorText.toLowerCase().includes('already subscribed') ||
                        errorText.toLowerCase().includes('is already a list member')) {
                        showSuccess("✅ You're already on the list! 🎶");
                    } else {
                        errorMsg.textContent = errorText || 'Something went wrong. Please try again.';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Get the List';
                    }
                }
            }

            submitBtn.addEventListener('click', handleSubmit);
            emailInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSubmit(e);
            });
        })();

        // ---- Sticky Subscribe Footer ----
        (function initSubscribeFooter() {
            const footer = document.getElementById('subscribeFooter');
            const cta = document.getElementById('subscribeFooterBtn');
            const closeBtn = document.getElementById('subscribeFooterClose');

            if (!footer || !cta) return;

            const DISMISSED_KEY = 'wyxr_subscribe_footer_dismissed';
            const SUBSCRIBED_KEY = 'wyxr_signup_banner_success';

            if (sessionStorage.getItem(SUBSCRIBED_KEY) || sessionStorage.getItem(DISMISSED_KEY)) return;

            let shown = false;

            function show() {
                if (shown) return;
                shown = true;
                footer.classList.add('visible');
                document.body.classList.add('has-subscribe-footer');
            }

            function dismiss() {
                footer.classList.remove('visible');
                document.body.classList.remove('has-subscribe-footer');
                sessionStorage.setItem(DISMISSED_KEY, '1');
                if (observer) observer.disconnect();
            }

            cta.addEventListener('click', () => {
                if (openSubscribeModal) openSubscribeModal();
                dismiss();
            });
            closeBtn.addEventListener('click', dismiss);

            // IntersectionObserver on a sentinel at 500px
            const sentinel = document.createElement('div');
            sentinel.style.cssText = 'height:1px;width:1px;position:absolute;top:500px;left:0;pointer-events:none;';
            sentinel.setAttribute('aria-hidden', 'true');
            document.body.appendChild(sentinel);

            let observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting && entry.boundingClientRect.top < 0) show();
                });
            }, { threshold: 0 });
            observer.observe(sentinel);

            // Auto-dismiss if user subscribes via another path
            const check = setInterval(() => {
                if (sessionStorage.getItem(SUBSCRIBED_KEY)) { dismiss(); clearInterval(check); }
            }, 1000);
            setTimeout(() => clearInterval(check), 600000);
        })();

        // ---- Data Loading (stale-while-revalidate with localStorage) ----
        const CACHE_KEY = 'wyxr_events_cache';

        function getCachedEvents() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch { return null; }
        }

        function setCachedEvents(events) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(events));
            } catch { /* quota exceeded — ignore */ }
        }

        function renderCalendarSponsor() {
            const banner = document.getElementById('calendarSponsorBanner');
            if (!banner) return;
            if (!calendarSponsor) {
                banner.style.display = 'none';
                return;
            }
            const link = document.getElementById('calSponsorLink');
            const img = document.getElementById('calSponsorImg');
            const copy = document.getElementById('calSponsorCopy');
            if (calendarSponsor.link_url) {
                link.href = calendarSponsor.link_url;
            } else {
                link.removeAttribute('href');
                link.style.cursor = 'default';
            }
            img.src = calendarSponsor.image_url;
            img.alt = calendarSponsor.name || 'Calendar Sponsor';
            if (calendarSponsor.copy_line) {
                copy.textContent = calendarSponsor.copy_line;
                copy.style.display = 'block';
            } else {
                copy.style.display = 'none';
            }
            banner.style.display = 'block';
        }

        function showEvents(events) {
            allEvents = events;
            loadingState.style.display = 'none';
            eventList.style.display = 'block';
            buildChips();
            renderEvents();
        }

        async function fetchFreshEvents(bustCache) {
            const startDate = new Date(minYear, minMonth, 1).toISOString().split('T')[0];
            const endDate = new Date(maxYear, maxMonth + 1, 0).toISOString().split('T')[0];
            let url = `${API_BASE}/api/events?start_date=${startDate}&end_date=${endDate}`;
            if (bustCache) url += `&_t=${Date.now()}`;

            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`API error ${resp.status}`);
            return resp.json();
        }

        async function loadAllEvents() {
            // 1. Instant render from cache if available
            const cached = getCachedEvents();
            if (cached && cached.length > 0) {
                showEvents(cached);
            }

            // 2. Fetch fresh events + sponsors + calendar sponsor in parallel
            try {
                const [fresh, sponsors, calSponsor] = await Promise.all([
                    fetchFreshEvents(false),
                    fetch(`${API_BASE}/api/sponsors`).then(r => r.ok ? r.json() : []).catch(() => []),
                    fetch(`${API_BASE}/api/calendar-sponsor`).then(r => r.ok ? r.json() : null).catch(() => null),
                ]);
                allSponsors = Array.isArray(sponsors) ? sponsors : [];
                calendarSponsor = (calSponsor && calSponsor.id) ? calSponsor : null;
                renderCalendarSponsor();
                const changed = JSON.stringify(fresh) !== JSON.stringify(allEvents);
                setCachedEvents(fresh);
                if (changed) showEvents(fresh);
                else renderEvents(); // re-render to inject sponsor cards
            } catch (err) {
                if (!cached || cached.length === 0) {
                    loadingState.textContent = 'Failed to load events. Please refresh.';
                } else {
                    console.warn('API fetch failed, showing cached data:', err);
                }
            }
        }

        // "Refresh data" link — clears cache and forces fresh fetch
        document.getElementById('refreshData')?.addEventListener('click', async (e) => {
            e.preventDefault();
            localStorage.removeItem(CACHE_KEY);
            loadingState.textContent = 'Refreshing...';
            loadingState.style.display = 'block';
            try {
                const fresh = await fetchFreshEvents(true);
                setCachedEvents(fresh);
                showEvents(fresh);
            } catch (err) {
                loadingState.textContent = 'Failed to refresh. Please try again.';
                console.error('Refresh error:', err);
            }
        });

        // ---- Neighborhood Chips ----
        function buildChips() {
            // Count events per neighborhood for current month
            const counts = {};
            let totalInMonth = 0;
            allEvents.forEach(e => {
                const d = new Date(e.date + 'T12:00:00');
                if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                    totalInMonth++;
                    const nh = e.neighborhood || 'Other';
                    counts[nh] = (counts[nh] || 0) + 1;
                }
            });

            // Sort by count descending, "Other" always last
            const sorted = Object.entries(counts).sort((a, b) => {
                if (a[0] === 'Other') return 1;
                if (b[0] === 'Other') return -1;
                return b[1] - a[1];
            });

            chipRow.innerHTML = `<button class="chip${activeNeighborhood === 'all' ? ' active' : ''}" data-neighborhood="all">All<span class="chip-count">${totalInMonth}</span></button>`;

            sorted.forEach(([nh, count]) => {
                const isActive = activeNeighborhood === nh;
                chipRow.innerHTML += `<button class="chip${isActive ? ' active' : ''}" data-neighborhood="${esc(nh)}">${esc(nh)}<span class="chip-count">${count}</span></button>`;
            });

            // Chip click handlers
            chipRow.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeNeighborhood = chip.dataset.neighborhood;
                    chipRow.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    renderEvents();
                });
            });
        }

        // ---- Deduplication ----
        function normalizeForDedup(text) {
            if (!text) return '';
            let s = text.toLowerCase().trim();
            // Remove "the " prefix
            s = s.replace(/^the\s+/g, '');
            // Remove bracketed content
            s = s.replace(/\s*\[([^\]]+)\]\s*/g, ' ');
            s = s.replace(/\s*\(([^\)]+)\)\s*/g, ' ');
            // Remove common words
            s = s.replace(/\s*(live!?|concert|tour|show|presents?|featuring|feat\.?|ft\.?|ep release party?|release party?)\s*/gi, ' ');
            // Replace punctuation with spaces
            s = s.replace(/[^\w\s]/g, ' ');
            // Collapse whitespace
            s = s.replace(/\s+/g, ' ').trim();
            return s;
        }

        function deduplicateEvents(events) {
            // Group by date + venue, then dedupe by normalized title
            const groups = {};
            events.forEach(e => {
                const key = `${e.date}|${normalizeForDedup(e.venue || '')}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(e);
            });

            const deduped = [];
            Object.values(groups).forEach(group => {
                const seen = [];
                group.forEach(event => {
                    const normalized = normalizeForDedup(event.title || '');
                    const isDup = seen.some(s => {
                        const sNorm = normalizeForDedup(s.title || '');
                        // Exact match
                        if (normalized === sNorm) return true;
                        // Space-removed match (handles "slamhound" vs "slam hound")
                        const noSpaceA = normalized.replace(/\s+/g, '');
                        const noSpaceB = sNorm.replace(/\s+/g, '');
                        if (noSpaceA === noSpaceB && noSpaceA.length >= 5) return true;
                        // One contains the other (min length 5)
                        if (normalized.length >= 5 && sNorm.length >= 5) {
                            if (normalized.includes(sNorm) || sNorm.includes(normalized)) return true;
                        }
                        // Word overlap check
                        const wordsA = normalized.split(' ').filter(w => w.length > 2);
                        const wordsB = sNorm.split(' ').filter(w => w.length > 2);
                        if (wordsA.length && wordsB.length) {
                            const intersection = wordsA.filter(w => wordsB.includes(w)).length;
                            const union = new Set([...wordsA, ...wordsB]).size;
                            if (intersection / union > 0.7) return true;
                            // All words from shorter in longer
                            const shorter = wordsA.length <= wordsB.length ? wordsA : wordsB;
                            const longer = wordsA.length <= wordsB.length ? wordsB : wordsA;
                            if (shorter.every(w => longer.includes(w))) return true;
                        }
                        return false;
                    });
                    if (!isDup) {
                        seen.push(event);
                    }
                });
                deduped.push(...seen);
            });

            return deduped;
        }

        // ---- Filtering ----
        function getFilteredEvents() {
            const todayStr = new Date().toISOString().split('T')[0];
            const filtered = allEvents.filter(e => {
                // Hide past events
                if (e.date < todayStr) return false;

                // Month filter
                const d = new Date(e.date + 'T12:00:00');
                if (d.getMonth() !== currentMonth || d.getFullYear() !== currentYear) return false;

                // Neighborhood filter
                if (activeNeighborhood !== 'all') {
                    const nh = e.neighborhood || 'Other';
                    if (nh !== activeNeighborhood) return false;
                }

                // Search filter
                if (searchQuery) {
                    const text = `${e.title || ''} ${e.venue || ''} ${e.neighborhood || ''}`.toLowerCase();
                    if (!text.includes(searchQuery)) return false;
                }

                return true;
            });

            // Deduplicate after filtering
            return deduplicateEvents(filtered);
        }

        // ---- Rendering ----
        function renderPresentsSection() {
            // Remove old presents section
            eventList.querySelector('.presents-section')?.remove();

            const todayStr = new Date().toISOString().split('T')[0];
            const presentsEvents = allEvents.filter(e => {
                if (!e.is_wyxr_presents || e.is_active === false) return false;
                if (e.date < todayStr) return false;
                // Apply search filter
                if (searchInput.value.trim()) {
                    const query = searchInput.value.trim().toLowerCase();
                    const text = `${e.title || ''} ${e.venue || ''} ${e.neighborhood || ''}`.toLowerCase();
                    if (!text.includes(query)) return false;
                }
                // Apply neighborhood filter
                const activeChip = document.querySelector('.chip.active');
                const activeNeighborhood = activeChip ? activeChip.dataset.neighborhood : 'all';
                if (activeNeighborhood !== 'all') {
                    const nh = e.neighborhood || 'Other';
                    if (nh !== activeNeighborhood) return false;
                }
                return true;
            });

            if (presentsEvents.length === 0) return;

            let presentsHtml = '';
            presentsEvents.forEach(e => {
                const d = new Date(e.date + 'T12:00:00');
                const dateStr = d.toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric'
                });
                let line = `<span class="artist">${esc(e.title)}</span>`;
                line += ` <span class="venue">@ ${esc(e.venue || '')}</span>`;
                const dateLine = `<div class="date-line">${dateStr}${e.start_time ? ' &middot; ' + esc(e.start_time) : ''}</div>`;

                if (e.ticket_url) {
                    presentsHtml += `<div class="presents-event"><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener"><span class="presents-badge">WYXR Presents</span>${line}</a>${dateLine}</div>`;
                } else {
                    presentsHtml += `<div class="presents-event"><span class="presents-badge">WYXR Presents</span>${line}${dateLine}</div>`;
                }
            });

            const presentsSection = document.createElement('div');
            presentsSection.className = 'presents-section';
            presentsSection.innerHTML = `<div class="presents-header">WYXR Presents</div>${presentsHtml}`;
            eventList.insertBefore(presentsSection, eventList.querySelector('.event-count')?.nextSibling || eventList.querySelector('.day-section') || eventList.firstChild);
        }

        function renderEvents() {
            const filtered = getFilteredEvents();

            eventCount.textContent = `${filtered.length} show${filtered.length !== 1 ? 's' : ''} in ${monthNames[currentMonth]} ${currentYear}`;

            if (filtered.length === 0) {
                // Remove old day sections and sponsor callouts
                eventList.querySelectorAll('.day-section, .sponsor-callout, .subscribe-callout').forEach(s => s.remove());
                eventList.querySelector('.no-events')?.remove();
                const p = document.createElement('p');
                p.className = 'no-events';
                p.textContent = 'No events found for this month with the current filters.';
                eventList.appendChild(p);
                renderPresentsSection();
                return;
            }

            // Remove old content
            eventList.querySelectorAll('.day-section, .no-events, .sponsor-callout, .subscribe-callout').forEach(s => s.remove());

            // Group by date
            const byDate = {};
            const dateOrder = [];
            filtered.forEach(e => {
                if (!byDate[e.date]) {
                    byDate[e.date] = [];
                    dateOrder.push(e.date);
                }
                byDate[e.date].push(e);
            });
            dateOrder.sort();

            // Inline subscribe callouts — every 4th day section
            const isSubscribed = sessionStorage.getItem('wyxr_signup_banner_success');
            let daySectionIndex = 0;
            const SUBSCRIBE_INTERVAL = 4;
            const SUBSCRIBE_COPY = [
                { text: 'Never miss a Memphis show.', cta: 'Get the weekly list \u2192' },
                { text: 'Free every Friday: DJ picks + this week\u2019s best shows.', cta: 'Subscribe \u2192' },
                { text: 'WYXR DJs pick the best shows each week.', cta: 'Get it free \u2192' },
                { text: 'This calendar updates daily. Want a Friday summary?', cta: 'Subscribe \u2192' },
            ];
            let subscribeCopyIndex = 0;

            dateOrder.forEach(dateStr => {
                const dayEvents = byDate[dateStr];
                const d = new Date(dateStr + 'T12:00:00');
                const dayName = d.toLocaleDateString('en-US', {
                    weekday: 'long', month: 'long', day: 'numeric'
                }).toUpperCase();

                // Separate featured (WYXR Pick / Presents) from normal events
                const featuredEvents = dayEvents.filter(e => e.is_featured || e.is_wyxr_presents);
                const normalEvents = dayEvents.filter(e => !e.is_featured && !e.is_wyxr_presents);

                let eventLines = '';

                // 1. Render featured events first — grouped under a single header
                if (featuredEvents.length > 0) {
                    const picks = featuredEvents.filter(e => e.is_featured && !e.is_wyxr_presents);
                    const presents = featuredEvents.filter(e => e.is_wyxr_presents);

                    // WYXR Picks group
                    if (picks.length > 0) {
                        const label = picks.length === 1 ? 'WYXR Pick' : 'WYXR Picks';
                        let pickItems = '';
                        picks.forEach(e => {
                            let line = `<span class="artist">${esc(e.title)}</span> — `;
                            line += `<span class="venue">${esc(e.venue || '')}</span>`;
                            if (e.start_time) line += ` <span class="time">(${esc(e.start_time)})</span>`;
                            if (e.ticket_url) {
                                pickItems += `<li class="featured event--featured"><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${line}</a></li>`;
                            } else {
                                pickItems += `<li class="featured event--featured">${line}</li>`;
                            }
                        });
                        eventLines += `<li class="venue-group featured-group"><div class="featured-group-header"><span class="featured-badge">${label}</span></div><ul class="venue-artists">${pickItems}</ul></li>`;
                    }

                    // WYXR Presents — render individually (rare, keep badge per item)
                    presents.forEach(e => {
                        let line = `<span class="artist">${esc(e.title)}</span> — `;
                        line += `<span class="venue">${esc(e.venue || '')}</span>`;
                        if (e.start_time) line += ` <span class="time">(${esc(e.start_time)})</span>`;
                        const badge = '<span class="presents-badge">WYXR Presents</span> ';
                        if (e.ticket_url) {
                            eventLines += `<li class="featured event--featured"><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${badge}${line}</a></li>`;
                        } else {
                            eventLines += `<li class="featured event--featured">${badge}${line}</li>`;
                        }
                    });
                }

                // 2. Group remaining normal events by venue
                const venueGroups = {};
                const venueOrder = [];
                normalEvents.forEach(e => {
                    const key = (e.venue || '').toLowerCase();
                    if (!venueGroups[key]) {
                        venueGroups[key] = [];
                        venueOrder.push(key);
                    }
                    venueGroups[key].push(e);
                });

                venueOrder.forEach(venueKey => {
                    const events = venueGroups[venueKey];

                    if (events.length === 1) {
                        const e = events[0];
                        let line = `<span class="artist">${esc(e.title)}</span> — `;
                        line += `<span class="venue">${esc(e.venue || '')}</span>`;
                        if (e.start_time) line += ` <span class="time">(${esc(e.start_time)})</span>`;

                        if (e.ticket_url) {
                            eventLines += `<li><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${line}</a></li>`;
                        } else {
                            eventLines += `<li>${line}</li>`;
                        }
                    } else {
                        const venueName = events[0].venue || '';
                        const times = events.map(e => e.start_time);
                        const allSameTime = new Set(times).size === 1;
                        const sharedTime = allSameTime ? times[0] : null;

                        let artistItems = '';
                        events.forEach(e => {
                            let artistText = `<span class="artist">${esc(e.title)}</span>`;
                            if (!allSameTime && e.start_time) {
                                artistText += ` <span class="time">(${esc(e.start_time)})</span>`;
                            }
                            if (e.ticket_url) {
                                artistItems += `<li><a href="${esc(e.ticket_url)}" target="_blank" rel="noopener">${artistText}</a></li>`;
                            } else {
                                artistItems += `<li>${artistText}</li>`;
                            }
                        });

                        let footer = `<span class="venue">${esc(venueName)}</span>`;
                        if (sharedTime) footer += ` <span class="time">(${esc(sharedTime)})</span>`;

                        eventLines += `<li class="venue-group"><ul class="venue-artists">${artistItems}</ul><div class="venue-footer">${footer}</div></li>`;
                    }
                });

                const section = document.createElement('div');
                section.className = 'day-section';
                section.innerHTML = `<h2>${dayName}</h2><ul>${eventLines}</ul>`;
                eventList.appendChild(section);

                // Inject sponsor callout after this date's section if any sponsor targets it
                const daySponsors = allSponsors.filter(s => s.display_after_date === dateStr);
                daySponsors.forEach(s => {
                    const callout = document.createElement('div');
                    callout.className = 'sponsor-callout';
                    const imgHtml = s.link_url
                        ? `<a href="${esc(s.link_url)}" target="_blank" rel="noopener"><img src="${esc(s.image_url)}" alt="${esc(s.name)}" class="sponsor-img" loading="lazy"></a>`
                        : `<img src="${esc(s.image_url)}" alt="${esc(s.name)}" class="sponsor-img" loading="lazy">`;
                    callout.innerHTML = `<span class="sponsor-label">Sponsored</span>${imgHtml}`;
                    eventList.appendChild(callout);
                });

                // Inline subscribe callout every Nth day section
                daySectionIndex++;
                if (!isSubscribed && daySectionIndex % SUBSCRIBE_INTERVAL === 0) {
                    const copy = SUBSCRIBE_COPY[subscribeCopyIndex % SUBSCRIBE_COPY.length];
                    const sc = document.createElement('div');
                    sc.className = 'subscribe-callout';
                    sc.setAttribute('role', 'button');
                    sc.setAttribute('tabindex', '0');
                    sc.setAttribute('aria-label', 'Subscribe to weekly email');
                    sc.innerHTML = `<span class="subscribe-callout-text">${copy.text}</span><span class="subscribe-callout-cta">${copy.cta}</span>`;
                    sc.addEventListener('click', () => openSubscribeModal && openSubscribeModal());
                    sc.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSubscribeModal && openSubscribeModal(); }
                    });
                    eventList.appendChild(sc);
                    subscribeCopyIndex++;
                }
            });

            renderPresentsSection();
        }

        // ---- Month Navigation ----
        const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function updateMonthDisplay() {
            monthLabel.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // Disable prev if at min
            prevBtn.disabled = (currentYear === minYear && currentMonth <= minMonth);
            // Disable next if at max
            nextBtn.disabled = (currentYear > maxYear || (currentYear === maxYear && currentMonth >= maxMonth));
        }

        prevBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            updateMonthDisplay();
            buildChips();
            renderEvents();
        });

        nextBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            updateMonthDisplay();
            buildChips();
            renderEvents();
        });

        // ---- Search ----
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchQuery = searchInput.value.toLowerCase().trim();
                renderEvents();
            }, 200);
        });

        // ---- HTML Escape ----
        function esc(str) {
            if (!str) return '';
            const el = document.createElement('span');
            el.textContent = str;
            return el.innerHTML;
        }

        // ---- Init ----
        updateMonthDisplay();
        loadAllEvents();
    })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
